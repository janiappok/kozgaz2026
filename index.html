"quiz","chapter":8,"question":"Melyik állítás igaz a szokásos U alakú görbéknél?","options":["MC az AC minimumában metszi az AC-t","Az AFC a kibocsátással mindig nő","A MC és a TC ugyanaz","A fix költség mindig nulla"],"answer":0,"why":"Amíg MC<AC, az átlag csökken; MC>AC esetén nő. A fordulópont MC=AC.","sub":"Görbeértelmezés","visual":null,"id":132,"notes":"Melyik állítás igaz a szokásos U alakú görbéknél?"},{"t":"Költségekről öt mondatban","kind":"summary","chapter":8,"lead":"","points":["Explicit költség: tényleges pénzkifizetés; implicit: feláldozott hozam.","TC = FC + VC.","MC = ΔTC/ΔQ, azaz a következő termék költsége.","AC = AFC + AVC; a MC az AC és AVC minimumát metszi.","A hosszú távú LAC a megválasztható üzemméretek költségminimumait mutatja."],"id":133,"notes":""},{"t":"Tökéletes verseny és profitmaximalizálás","kind":"chapter","chapter":9,"sub":"MENNYIT ÉRDEMES TERMELNI?","lead":"A kompetitív vállalat döntése, P=MC szabály, üzembezárás, fedezeti pont és piaci időtávok.","id":134,"notes":"A kompetitív vállalat döntése, P=MC szabály, üzembezárás, fedezeti pont és piaci időtávok."},{"t":"Tökéletes verseny","kind":"definition","chapter":9,"definition":"Elméleti piacforma, ahol sok kis vállalat homogén terméket kínál, a belépés szabad, és az egyes vállalatok árelfogadók.","explain":"A tananyag példázatként hangsúlyozza, hogy a tökéletes verseny feltételei a gyakorlatban ritkán teljesülnek maradéktalanul. A modell mégis hasznos viszonyítási pont.","example":"Sok kicsi eladó, azonos minőségű termék és nyilvános piaci ár.","key":"Az egyes vállalat nem az árról, hanem a termelt mennyiségről dönt.","visual":null,"notes":"Elméleti piacforma, ahol sok kis vállalat homogén terméket kínál, a belépés szabad, és az egyes vállalatok árelfogadók. A tananyag példázatként hangsúlyozza, hogy a tökéletes verseny feltételei a gyakorlatban ritkán teljesülnek maradéktalanul. A modell mégis hasznos viszonyítási pont.","id":135},{"t":"Tökéletes verseny feltételei","kind":"blocks","chapter":9,"blocks":[["Sok piaci szereplő","Egyetlen cég termelése nem befolyásolja érdemben a piaci árat.","Árelfogadó viselkedés."],["Homogén termék","A kínálat egységei egymással helyettesíthetők.","Nincs döntő márkakülönbség."],["Szabad be- és kilépés","Hosszú távon a vállalatok beléphetnek és kiléphetnek.","A tartós többletprofit eltűnhet."],["Információs és döntési feltevések","A szereplők racionálisan és a piaci jelzésekre reagálva döntenek.","Elméleti egyszerűsítés."]],"lead":"","key":"A hosszú távú nulla gazdasági profit nem jelenti azt, hogy nincs bevétel vagy számviteli profit.","notes":"A hosszú távú nulla gazdasági profit nem jelenti azt, hogy nincs bevétel vagy számviteli profit.","id":136},{"t":"Árelfogadó vállalat kereslete","kind":"concept","chapter":9,"lead":"Egy kis kompetitív vállalat számára a piaci ár külső adottság.","points":["Ugyanazon piaci áron a vállalat saját kibocsátásának több lehetséges szintje mellett tud értékesíteni.","A vállalat saját keresleti görbéje vízszintes a piaci árnál.","A teljes bevétel TR = P×Q."],"example":"Ha a piaci ár 500 Ft, az 1., 2. és 3. darab eladása is 500–500 Ft többletbevételt ad a modellben.","key":"Tökéletes versenyben MR = P.","visual":"firm","notes":"Egy kis kompetitív vállalat számára a piaci ár külső adottság. Ha a piaci ár 500 Ft, az 1., 2. és 3. darab eladása is 500–500 Ft többletbevételt ad a modellben.","formula":"","id":137},{"t":"Határbevétel (MR)","kind":"definition","chapter":9,"definition":"A teljes bevétel változása az értékesített mennyiség egységnyi növelésekor.","explain":"A határbevétel a következő termék eladásának többletbevétele. Tökéletes versenyben az árelfogadó vállalat MR-je megegyezik a piaci árral.","example":"500 Ft-os állandó piaci áron még egy termék értékesítése 500 Ft bevételt hoz.","key":"MR = ΔTR/ΔQ; kompetitív vállalatnál MR=P.","visual":null,"notes":"A teljes bevétel változása az értékesített mennyiség egységnyi növelésekor. A határbevétel a következő termék eladásának többletbevétele. Tökéletes versenyben az árelfogadó vállalat MR-je megegyezik a piaci árral.","id":138},{"t":"A vállalat profitja","kind":"formula","chapter":9,"formula":"π = TR − TC","lead":"A profit az elért teljes bevétel és teljes költség különbsége.","points":["TR = P×Q.","TC = FC + VC.","π lehet pozitív, nulla vagy negatív."],"example":"1000 Ft ár mellett 100 darab eladása TR=100 000 Ft; TC=85 000 Ft esetén π=15 000 Ft.","key":"A profit nagysága nem csak az eladási ártól, hanem az egységköltségtől és a mennyiségtől is függ.","visual":null,"notes":"A profit az elért teljes bevétel és teljes költség különbsége. 1000 Ft ár mellett 100 darab eladása TR=100 000 Ft; TC=85 000 Ft esetén π=15 000 Ft.","id":139},{"t":"Határprofit (Mπ)","kind":"definition","chapter":9,"definition":"A profit megváltozása egységnyi többletkibocsátás mellett.","explain":"A határprofit pozitív, ha a következő termék több bevételt ad, mint amennyi többletköltséget okoz. Negatív határprofitnál a következő egység csökkenti a profitot.","example":"MR=800 Ft, MC=650 Ft → még egy termék 150 Ft-tal növeli a profitot.","key":"Mπ = MR − MC.","visual":null,"notes":"A profit megváltozása egységnyi többletkibocsátás mellett. A határprofit pozitív, ha a következő termék több bevételt ad, mint amennyi többletköltséget okoz. Negatív határprofitnál a következő egység csökkenti a profitot.","id":140},{"t":"A profitmaximum feltétele","kind":"formula","chapter":9,"formula":"MR = MC  •  tökéletes versenyben P = MC","lead":"A kibocsátást addig célszerű bővíteni, amíg a következő egység többletbevétele meghaladja a többletköltséget; optimumban kiegyenlítődnek.","points":["Ha MR > MC: érdemes lehet növelni Q-t.","Ha MR < MC: érdemes lehet csökkenteni Q-t.","U alakú MC esetén a növekvő ág metszése adhat profitmaximumot."],"example":"A P=MC önmagában még nem elegendő a maximumhoz; a MC növekvő ága és a működési feltételek számítanak.","key":"118–120","visual":"firmlive","notes":"A kibocsátást addig célszerű bővíteni, amíg a következő egység többletbevétele meghaladja a többletköltséget; optimumban kiegyenlítődnek. A P=MC önmagában még nem elegendő a maximumhoz; a MC növekvő ága és a működési feltételek számítanak.","id":141},{"t":"Interaktív vállalati döntés","kind":"visual","chapter":9,"visual":"firmlive","lead":"Változtasd meg az árat! A görbe megmutatja, hol találkozik a piaci ár a határköltséggel.","points":["Magasabb P általában nagyobb Q* mellett éri el a növekvő MC-t.","A profit pozitív vagy negatív is lehet.","Külön kell vizsgálni a működés és a leállás feltételét."],"key":"A szimuláció szemléltető számpélda, nem a PDF-ből átvett konkrét költségfüggvény.","notes":"Változtasd meg az árat! A görbe megmutatja, hol találkozik a piaci ár a határköltséggel. A szimuláció szemléltető számpélda, nem a PDF-ből átvett konkrét költségfüggvény.","example":"","id":142},{"t":"Üzembezárási pont (Ü)","kind":"definition","chapter":9,"definition":"A rövid távú átlagos változó költség minimumához tartozó ár és mennyiség, ahol MC=AVC.","explain":"Ha a piaci ár még a változó költségeket sem fedezi, rövid távon a termelés helyett a leállás lehet kedvezőbb. A fix költség leálláskor is fennmaradhat.","example":"Ha egy termék 300 Ft-ért adható el, de az előállításának változó költsége darabonként 400 Ft, a termelés növeli a veszteséget.","key":"Pü = AVCmin = MC az Ü pontban.","visual":"costs","notes":"A rövid távú átlagos változó költség minimumához tartozó ár és mennyiség, ahol MC=AVC. Ha a piaci ár még a változó költségeket sem fedezi, rövid távon a termelés helyett a leállás lehet kedvezőbb. A fix költség leálláskor is fennmaradhat.","id":143},{"t":"Miért termelhet egy veszteséges cég?","kind":"concept","chapter":9,"lead":"A rövid távú döntésnél a változó költség fedezete a kulcs.","points":["Leálláskor: veszteség = FC, amennyiben minden VC elkerülhető.","Termelésnél: veszteség = TC − TR.","Ha TR>VC, a bevétel a fix költségek egy részét is fedezi.","Ezért P>AVC mellett átmenetileg veszteséges működés is lehet racionális."],"example":"Egy cég 800 ezer Ft fix költséget fizet akkor is, ha zárva van; termelve legalább egy része megtérülhet.","key":"Rövid távon a veszteség minimalizálása is racionális döntés.","visual":null,"notes":"A rövid távú döntésnél a változó költség fedezete a kulcs. Egy cég 800 ezer Ft fix költséget fizet akkor is, ha zárva van; termelve legalább egy része megtérülhet.","formula":"","id":144},{"t":"Ár és működési döntés","kind":"blocks","chapter":9,"blocks":[["P < AVCmin","Rövid távon célszerű szüneteltetni a termelést.","Kínálat = 0."],["P = AVCmin","Közömbös a működés és leállás között a standard modellben.","Veszteség = FC."],["AVCmin < P < ACmin","Veszteséges termelés, de a változó költséget fedezi.","A fix költség egy része megtérül."],["P = ACmin","Fedezeti pont, gazdasági profit nulla.","TR = TC."],["P > ACmin","Pozitív gazdasági profit lehetséges az optimális mennyiségnél.","TR > TC."]],"lead":"","key":"Az összehasonlítás az optimális mennyiséghez tartozó releváns költségekre vonatkozik.","notes":"Az összehasonlítás az optimális mennyiséghez tartozó releváns költségekre vonatkozik.","id":145},{"t":"Fedezeti pont (F)","kind":"definition","chapter":9,"definition":"Az a helyzet, ahol a vállalat teljes bevétele és teljes gazdasági költsége megegyezik, így a gazdasági profit nulla.","explain":"A PDF ábráin a fedezeti ár az AC minimumával egyenlő, ezen a ponton MC=AC.","example":"Ha 1500 Ft ár mellett az átlagköltség is 1500 Ft, a gazdasági profit nulla.","key":"Pf = ACmin = MC.","visual":"costs","notes":"Az a helyzet, ahol a vállalat teljes bevétele és teljes gazdasági költsége megegyezik, így a gazdasági profit nulla. A PDF ábráin a fedezeti ár az AC minimumával egyenlő, ezen a ponton MC=AC.","id":146},{"t":"Üzembezárás és fedezet egy ábrán","kind":"visual","chapter":9,"visual":"costs","lead":"A kompetitív vállalat rövid távú kínálati görbéje a MC üzembezárási pont feletti szakasza.","points":["Ü: MC és AVC minimumának metszése.","F: MC és AC minimumának metszése.","Ü és F között: veszteséges, de még működő vállalat.","F felett: pozitív gazdasági profit érhető el."],"key":"Az ár melyik költséghatárt éri el? Ez a működési döntés első kérdése.","notes":"A kompetitív vállalat rövid távú kínálati görbéje a MC üzembezárási pont feletti szakasza. Az ár melyik költséghatárt éri el? Ez a működési döntés első kérdése.","example":"","id":147},{"t":"A vállalat rövid távú kínálati görbéje","kind":"concept","chapter":9,"lead":"Az árelfogadó vállalat minden árhoz a számára optimális kibocsátást rendeli.","points":["P < AVCmin: nincs termelés.","P ≥ AVCmin: a növekvő MC szakasza határozza meg a kínálatot.","Az egyéni kínálatok összegzése adja a piaci kínálatot."],"example":"Piaci áremelkedéskor egy cég a növekvő MC-görbén nagyobb kibocsátásra állhat át.","key":"A teljes MC nem egyenlő a rövid távú kínálattal.","visual":null,"notes":"Az árelfogadó vállalat minden árhoz a számára optimális kibocsátást rendeli. Piaci áremelkedéskor egy cég a növekvő MC-görbén nagyobb kibocsátásra állhat át.","formula":"","id":148},{"t":"Pillanatnyi és rövid távú piaci egyensúly","kind":"visual","chapter":9,"visual":"timescales","lead":"A PDF több ábrával hasonlítja össze a rögzített és az alkalmazkodó kínálatot.","points":["Pillanatnyi idő: függőleges kínálat; a mennyiség adott.","Rövid táv: a kínálat felfelé emelkedő lehet.","Keresletnövekedésre rövid távon a mennyiség is növekedhet."],"key":"Egy előre legyártott készlet holnap nem bővíthető; egy hónap alatt már lehetséges új termelést szervezni.","notes":"A PDF több ábrával hasonlítja össze a rögzített és az alkalmazkodó kínálatot. Egy előre legyártott készlet holnap nem bővíthető; egy hónap alatt már lehetséges új termelést szervezni.","example":"","id":149},{"t":"Hosszú távú versenyzői egyensúly","kind":"definition","chapter":9,"definition":"Olyan helyzet, amelyben a szabad be- és kilépés hatására a tartós gazdasági többletprofit eltűnik.","explain":"Ha profit van, új vállalatok léphetnek be és bővülhet a kínálat. Ha tartós veszteség van, cégek hagyhatják el az ágazatot. Ez módosítja az egyensúlyi árat.","example":"Magas nyereség egy piacon új versenytársakat vonzhat, és idővel lefelé nyomhatja a piaci árat.","key":"Hosszú távú kompetitív egyensúlyban a gazdasági profit nulla lehet.","visual":"longrun","notes":"Olyan helyzet, amelyben a szabad be- és kilépés hatására a tartós gazdasági többletprofit eltűnik. Ha profit van, új vállalatok léphetnek be és bővülhet a kínálat. Ha tartós veszteség van, cégek hagyhatják el az ágazatot. Ez módosítja az egyensúlyi árat.","id":150},{"t":"Miért nulla a hosszú távú gazdasági profit?","kind":"concept","chapter":9,"lead":"A nulla gazdasági profit nem egyenlő a „nem keres pénzt a vállalat” állítással.","points":["A gazdasági költségben az implicit és normál alternatív hozam is szerepel.","A bevétel fedezi az inputok alternatív költségét.","Az extra profit új belépést vonz, ami növelheti a kínálatot."],"example":"Egy sikeres vállalat tulajdonosa gazdasági profit nélkül is kaphat a munkájáért és tőkéjéért szokásos hozamot.","key":"A „0 profit elve” a tananyagban a hosszú távú versenyegyensúlyhoz kötődik.","visual":null,"notes":"A nulla gazdasági profit nem egyenlő a „nem keres pénzt a vállalat” állítással. Egy sikeres vállalat tulajdonosa gazdasági profit nélkül is kaphat a munkájáért és tőkéjéért szokásos hozamot.","formula":"","id":151},{"t":"Vállalati döntéskvíz","kind":"quiz","chapter":9,"question":"Melyik az üzembezárási pont ára a standard modellben?","options":["Az átlagköltség maximuma","Az átlagos változó költség minimuma","A teljes bevétel maximuma","A munkabér kétszerese"],"answer":1,"why":"Az üzembezárási pontban MC=AVCmin, az alatta fekvő árak esetén a változó költség sem térül meg.","sub":"Kiemelt vizsgafogalom","visual":null,"id":152,"notes":"Melyik az üzembezárási pont ára a standard modellben?"},{"t":"A tökéletes verseny logikája","kind":"summary","chapter":9,"lead":"","points":["Árelfogadó vállalatnál MR = P.","Belső profitmaximum: MR=MC, így P=MC a növekvő MC-ágon.","Rövid távon a P<AVCmin szüneteltetést indokolhat.","A fedezeti pontban P=ACmin=MC, a gazdasági profit nulla.","Hosszú távon szabad belépés mellett a gazdasági többletprofit eltűnhet."],"id":153,"notes":""},{"t":"Monopólium és árdiszkrimináció","kind":"chapter","chapter":10,"sub":"MI VÁLTOZIK VERSENY NÉLKÜL?","lead":"Egyetlen eladó, határbevétel és határköltség, monopolár, árdiszkrimináció.","id":154,"notes":"Egyetlen eladó, határbevétel és határköltség, monopolár, árdiszkrimináció."},{"t":"Monopólium","kind":"definition","chapter":10,"definition":"Olyan piaci szerkezet, amelyben a kínálati oldalon egyetlen vállalat van jelen.","explain":"A monopolista nem egyszerűen árelfogadó; választott mennyisége és eladási ára összefügg a keresleti görbével. A belépési korlátok miatt tartós piaci ereje lehet.","example":"Egy kizárólagos infrastruktúra-szolgáltató piaci helyzete.","key":"Ár- és mennyiségi döntés összekapcsolódik.","visual":null,"notes":"Olyan piaci szerkezet, amelyben a kínálati oldalon egyetlen vállalat van jelen. A monopolista nem egyszerűen árelfogadó; választott mennyisége és eladási ára összefügg a keresleti görbével. A belépési korlátok miatt tartós piaci ereje lehet.","id":155},{"t":"Tökéletes verseny versus monopólium","kind":"blocks","chapter":10,"blocks":[["Tökéletes verseny","Sok kis eladó, homogén jószág és árelfogadó vállalat.","MR=P; az ár külső adottság."],["Monopólium","Egyetlen eladó, a vállalat a teljes piaci kereslettel szembesül.","MR általában a keresleti ár alatt van."],["Közös pont","Mindkettő profitmaximalizáló belső feltétele MR=MC.","A döntési környezet más."]],"lead":"","key":"A monopólium a mennyiséget MR=MC-nél választja, az árat a keresleti görbéről olvassa le.","notes":"A monopólium a mennyiséget MR=MC-nél választja, az árat a keresleti görbéről olvassa le.","id":156},{"t":"Miért van a monopolista MR-je a keresleti ár alatt?","kind":"concept","chapter":10,"lead":"Ha a monopólium egységes árat alkalmaz, több egység eladásához jellemzően csökkentenie kell az árat.","points":["Az új egység bevételt ad.","Az alacsonyabb ár a korábban eladott egységekre is érvényes lehet.","Emiatt a teljes bevétel növekménye kisebb az új egység áránál."],"example":"Ha minden jegy ára 1000 Ft-ról 900 Ft-ra csökken, a régi vevők is 100 Ft-tal kevesebbet fizetnek.","key":"Egységes árú monopóliumnál MR tipikusan a D-görbe alatt fut.","visual":"monopoly","notes":"Ha a monopólium egységes árat alkalmaz, több egység eladásához jellemzően csökkentenie kell az árat. Ha minden jegy ára 1000 Ft-ról 900 Ft-ra csökken, a régi vevők is 100 Ft-tal kevesebbet fizetnek.","formula":"","id":157},{"t":"A monopólium optimuma","kind":"formula","chapter":10,"formula":"MR = MC  →  Q*  →  P* a keresleti görbén","lead":"Először a termelési mennyiséget választja ki, majd a mennyiséghez tartozó fizetési hajlandóságból állapítja meg az árat.","points":["MR>MC: a kibocsátás növelése növelheti a profitot.","MR<MC: a kibocsátás csökkentése lehet előnyös.","Q* meghatározása után a D-görbén olvasható a P*."],"example":"A monopolár általában nem egyezik meg a határköltséggel.","key":"A profitmaximum feltétele itt is a határbevétel és határköltség egyenlősége.","visual":"monopoly","notes":"Először a termelési mennyiséget választja ki, majd a mennyiséghez tartozó fizetési hajlandóságból állapítja meg az árat. A monopolár általában nem egyezik meg a határköltséggel.","id":158},{"t":"Monopolár: vizuális levezetés","kind":"visual","chapter":10,"visual":"monopoly","lead":"A grafikonon a monopolista optimális kibocsátása az MR és MC metszéspontjában adódik. A hozzá tartozó árat a keresleti görbén keressük.","points":["A D-görbe adja az ár–mennyiség kapcsolatot.","MR a monopolista többletbevételét mutatja.","MC az utolsó egység többletköltsége."],"key":"A monopólium a tananyagban közönséges (egységes áras) és diszkrimináló formában szerepel.","notes":"A grafikonon a monopolista optimális kibocsátása az MR és MC metszéspontjában adódik. A hozzá tartozó árat a keresleti görbén keressük. A monopólium a tananyagban közönséges (egységes áras) és diszkrimináló formában szerepel.","example":"","id":159},{"t":"A monopólium működési feltételei","kind":"concept","chapter":10,"lead":"A profitmaximum nem jelenti automatikusan, hogy a vállalat nyereséges.","points":["Rövid távon az AVC fedezete a monopóliumnál is lényeges.","Ha a monopolár meghaladja az AC-t, pozitív gazdasági profit keletkezhet.","Belépési korlátok miatt ez a profit hosszabb távon is fennmaradhat."],"example":"Egy monopolista is leállhat, ha a kereslet túl gyenge a változó költségei fedezéséhez.","key":"A monopólium nem garantál profitot.","visual":null,"notes":"A profitmaximum nem jelenti automatikusan, hogy a vállalat nyereséges. Egy monopolista is leállhat, ha a kereslet túl gyenge a változó költségei fedezéséhez.","formula":"","id":160},{"t":"Monopólium és jóléti hatás","kind":"concept","chapter":10,"lead":"A PDF összehasonlító ábrája különböző árszinteket és mennyiségeket mutat monopólium és tökéletes verseny esetén.","points":["Egységes árú monopólium korlátozhatja a kibocsátást a kompetitív szinthez képest.","Az ár magasabb lehet, mint a versenyzői piacon.","A fogyasztói többlet egy része elvész vagy átalakul."],"example":"A PDF a közönséges monopóliumot nem Pareto-hatékonynak nevezi.","key":"A teljes piaci hatást a keresleti és költséggörbe együtt mutatja.","visual":"monopoly","notes":"A PDF összehasonlító ábrája különböző árszinteket és mennyiségeket mutat monopólium és tökéletes verseny esetén. A PDF a közönséges monopóliumot nem Pareto-hatékonynak nevezi.","formula":"","id":161},{"t":"Árdiszkrimináció","kind":"definition","chapter":10,"definition":"Ugyanazon vagy lényegében azonos termék eltérő vevőknek vagy vásárlási helyzetekben eltérő áron történő értékesítése.","explain":"A monopólium a fogyasztók eltérő fizetési hajlandóságát használja ki. Az egyes formák a személyhez, a mennyiséghez vagy a csoporthoz kötődnek.","example":"Diákkedvezmény, mennyiségi kedvezmény, személyre szabott ár — ezek más-más típusokat szemléltetnek.","key":"A PDF három fokozatot különít el.","visual":null,"notes":"Ugyanazon vagy lényegében azonos termék eltérő vevőknek vagy vásárlási helyzetekben eltérő áron történő értékesítése. A monopólium a fogyasztók eltérő fizetési hajlandóságát használja ki. Az egyes formák a személyhez, a mennyiséghez vagy a csoporthoz kötődnek.","id":162},{"t":"Az árdiszkrimináció három foka","kind":"blocks","chapter":10,"blocks":[["Elsőfokú","Minden egységet elvben az adott vevő maximális fizetési hajlandóságához igazított áron adnak el.","Egyéni rezervációs ár."],["Másodfokú","Az ár a vásárolt mennyiségtől vagy választott csomagtól függ.","Minden vevőnek azonos díjstruktúra."],["Harmadfokú","Eltérő fogyasztói csoportok különböző árat kapnak.","Például csoportalapú kedvezmény."]],"lead":"","key":"A tananyag további eszközként az árukapcsolást és a kétrészes árképzést is megnevezi.","notes":"A tananyag további eszközként az árukapcsolást és a kétrészes árképzést is megnevezi.","id":163},{"t":"Kétrészes árképzés","kind":"definition","chapter":10,"definition":"Olyan díjszerkezet, amely egyszeri vagy állandó belépési díjból és a felhasználás mennyiségétől függő árból áll.","explain":"A PDF címként említi, de nem részletezi. A következő példa kiegészítő, értelmezést segítő magyarázat.","example":"Edzőtermi belépési/havidíj + alkalmi szolgáltatás díja.","key":"Fix díj + egységnyi használati díj.","visual":null,"notes":"Olyan díjszerkezet, amely egyszeri vagy állandó belépési díjból és a felhasználás mennyiségétől függő árból áll. A PDF címként említi, de nem részletezi. A következő példa kiegészítő, értelmezést segítő magyarázat.","id":164},{"t":"Monopólium-ellenőrzés","kind":"quiz","chapter":10,"question":"Hol állapítja meg a monopólium az optimális termelési mennyiséget?","options":["Ahol P=0","Ahol MR=MC","Ahol TR=0","Mindig ott, ahol P=AC"],"answer":1,"why":"A monopolista a kibocsátást MR=MC feltételből választja, majd a keresleti görbéről olvassa le az ahhoz tartozó árat.","sub":"Profitmaximalizálás","visual":null,"id":165,"notes":"Hol állapítja meg a monopólium az optimális termelési mennyiséget?"},{"t":"Monopólium egy percben","kind":"summary","chapter":10,"lead":"","points":["Egyetlen eladó; az árra is hatással lehet.","Egységes árú monopóliumban az MR a keresleti ár alatt van.","Az optimális kibocsátás: MR = MC.","Az ár a keresleti görbéről olvasható le.","Az árdiszkrimináció első-, másod- vagy harmadfokú lehet."],"id":166,"notes":""},{"t":"Számítási feladatok részletesen","kind":"chapter","chapter":11,"sub":"A KÉPLETEKTŐL A MEGOLDÁSIG","lead":"a gyakorló számítási feladatok kidolgozása: egyensúly, fogyasztói keret, MRS és rugalmasság.","id":167,"notes":"a gyakorló számítási feladatok kidolgozása: egyensúly, fogyasztói keret, MRS és rugalmasság."},{"t":"Hogyan dolgozz fel egy számítási feladatot?","kind":"concept","chapter":11,"lead":"Mindegyik feladattípushoz ugyanazt a fegyelmezett megoldási sorrendet használd.","points":["Írd ki: mik az adatok és mit keresünk.","Válaszd ki az összefüggést, és csak utána helyettesíts.","Számolj egymás alá, a mértékegységeket megtartva.","Értelmezd a kapott eredményt: hiány, ár, mennyiség, keresleti kategória."],"example":"A jó levezetés nem puszta számsor: világossá teszi, miért az adott képlet kell.","key":"Ez oktatási módszertani kiegészítés.","visual":null,"notes":"Mindegyik feladattípushoz ugyanazt a fegyelmezett megoldási sorrendet használd. A jó levezetés nem puszta számsor: világossá teszi, miért az adott képlet kell.","formula":"","id":168},{"t":"1. feladat — a piaci egyensúly képlete","kind":"worked","chapter":11,"problem":"D(P)=15 000−130P és S(P)=70P−5000. Keressük P* és Q* értékét.","steps":["D=S → 15 000−130P = 70P−5000.","Adjunk 130P-t és 5000-et mindkét oldalhoz.","20 000 = 200P → P*=100 Ft.","Q*=D(100)=15 000−13 000=2000 db.","Ellenőrzés: S(100)=7000−5000=2000 db."],"conclusion":"Kereslet = kínálat = 2000 darab, 100 Ft-on.","visual":"marketlive","notes":"D(P)=15 000−130P és S(P)=70P−5000. Keressük P* és Q* értékét.","id":169},{"t":"2. feladat — az ármaximum hatása","kind":"worked","chapter":11,"problem":"A korábbi piacra 80 Ft-os ármaximum lép életbe. A piaci egyensúlyi ár 100 Ft.","steps":["D(80)=15 000−130×80 = 4600 db.","S(80)=70×80−5000 = 600 db.","Hiány = 4600−600 = 4000 db.","Mivel 80<100, a plafon kötő jellegű: a kereslet meghaladja a kínálatot."],"conclusion":"4000 egységnyi túlkereslet; a PDF sorban állást és jegyrendszert is lehetséges következményként sorol.","visual":"marketlive","notes":"A korábbi piacra 80 Ft-os ármaximum lép életbe. A piaci egyensúlyi ár 100 Ft.","id":170},{"t":"3. feladat — költségvetési egyenes","kind":"worked","chapter":11,"problem":"I=20 000 Ft; Px=500 Ft; Py=400 Ft.","steps":["Írjuk fel: 500X+400Y=20 000.","Y=0 esetén Xmax=20 000/500=40.","X=0 esetén Ymax=20 000/400=50.","Meredekség: −Px/Py=−500/400=−1,25."],"conclusion":"A költségvetési egyenes a (0;50) és (40;0) pontokat köti össze.","visual":"budgetlive","notes":"I=20 000 Ft; Px=500 Ft; Py=400 Ft.","id":171},{"t":"4. feladat — az Y termék drágulása","kind":"worked","chapter":11,"problem":"I=20 000 Ft és Px=500 Ft marad, Py viszont 400→800 Ft.","steps":["Új Ymax=20 000/800=25.","Xmax továbbra is 40.","Új költségvetési egyenes: 500X+800Y=20 000.","Új meredekség: −500/800=−0,625."],"conclusion":"A Y-tengelymetszet feleződik; a korlát elfordul.","visual":"budgetlive","notes":"I=20 000 Ft és Px=500 Ft marad, Py viszont 400→800 Ft.","id":172},{"t":"5. feladat — az X termék drágulása","kind":"worked","chapter":11,"problem":"I=20 000 Ft és Py=400 Ft marad, Px viszont 500→1000 Ft.","steps":["Új Xmax=20 000/1000=20.","Ymax továbbra is 50.","Új költségvetési egyenes: 1000X+400Y=20 000.","Új meredekség: −1000/400=−2,5."],"conclusion":"Az X-tengelymetszet feleződik; a korlát meredekebbé válik.","visual":"budgetlive","notes":"I=20 000 Ft és Py=400 Ft marad, Px viszont 500→1000 Ft.","id":173},{"t":"6. feladat — MRS kiszámítása","kind":"worked","chapter":11,"problem":"Azonos hasznosságot adó kosarak: (2;14), (4;10), (7;8), (9;7), (12;6).","steps":["Első szakasz: −(10−14)/(4−2)=2.","Második: −(8−10)/(7−4)=2/3.","Harmadik: −(7−8)/(9−7)=1/2.","Negyedik: −(6−7)/(12−9)=1/3."],"conclusion":"MRS: 2; 0,667; 0,5; 0,333 — fokozatosan csökken.","visual":"indifference","notes":"Azonos hasznosságot adó kosarak: (2;14), (4;10), (7;8), (9;7), (12;6).","id":174},{"t":"7. feladat — mozijegy: teljes bevétel","kind":"worked","chapter":11,"problem":"Mozijegy ára 700→350 Ft; kereslete 100→200 db.","steps":["Kezdeti TR0 = 700×100 = 70 000 Ft.","Új TR1 = 350×200 = 70 000 Ft.","Változás: ΔTR=0.","A két végpont között a teljes bevétel azonos."],"conclusion":"Az átlagbázisú (ív-)rugalmasság abszolút értéke 1 lesz.","visual":"revenue","notes":"Mozijegy ára 700→350 Ft; kereslete 100→200 db.","id":175},{"t":"8. feladat — mozijegy: kiindulóbázisú rugalmasság","kind":"worked","chapter":11,"problem":"Mozijegy: P0=700, P1=350; Q0=100, Q1=200.","steps":["Ár %-os változása: ΔP/P0=−350/700=−0,5.","Mennyiség %-os változása: ΔQ/Q0=100/100=+1.","ε=(+1)/(−0,5)=−2.","Abszolút értékben: |ε|=2 (rugalmas)."],"conclusion":"A PDF is 2-t kap kiindulóbázisú számolással.","visual":null,"notes":"Mozijegy: P0=700, P1=350; Q0=100, Q1=200.","id":176},{"t":"9. feladat — üdítő: kiindulóbázisú rugalmasság","kind":"worked","chapter":11,"problem":"Üdítő: P0=20, P1=40 Ft/dl; Q0=300, Q1=150 dl.","steps":["Árváltozás: ΔP/P0 = 20/20 = +1.","Mennyiségváltozás: ΔQ/Q0 = −150/300 = −0,5.","ε = −0,5/1 = −0,5.","Abszolút értékben: |ε|=0,5 (rugalmatlan)."],"conclusion":"Kiinduló bázissal a két példa eltérő kategóriát ad, noha mindkettő TR-je változatlan.","visual":null,"notes":"Üdítő: P0=20, P1=40 Ft/dl; Q0=300, Q1=150 dl.","id":177},{"t":"Az átlagbázisú (ív-)rugalmasság","kind":"formula","chapter":11,"formula":"εív = [ΔQ / ((Q₀+Q₁)/2)] / [ΔP / ((P₀+P₁)/2)]","lead":"A százalékos változások nevezőjében a kezdő- és végpont átlagát használjuk, így felcserélt időirányban szimmetrikus a számítás.","points":["Mennyiségátlag: (Q0+Q1)/2.","Árátlag: (P0+P1)/2.","Az eredményt a rugalmassági besoroláshoz abszolút értékben használjuk."],"example":"Mozijegy: (+100/150)/(−350/525) = (2/3)/(−2/3) = −1.","key":"Fontos: intervallumrugalmasság; nem azonos a görbe minden pontjára érvényes helyi rugalmassággal.","visual":null,"notes":"A százalékos változások nevezőjében a kezdő- és végpont átlagát használjuk, így felcserélt időirányban szimmetrikus a számítás. Mozijegy: (+100/150)/(−350/525) = (2/3)/(−2/3) = −1.","id":178},{"t":"10. feladat — mindkét ívrugalmasság","kind":"worked","chapter":11,"problem":"Számoljuk ki az átlagbázisú rugalmasságot a mozijegyre és az üdítőre.","steps":["Mozijegy: ΔQ/Qátl = 100/150 = 2/3.","Mozijegy: ΔP/Pátl = −350/525 = −2/3 → εív=−1.","Üdítő: ΔQ/Qátl = −150/225 = −2/3.","Üdítő: ΔP/Pátl = +20/30 = +2/3 → εív=−1."],"conclusion":"Mindkét példa |εív|=1 értéket ad, összhangban az azonos kezdő és végső teljes bevétellel.","visual":null,"notes":"Számoljuk ki az átlagbázisú rugalmasságot a mozijegyre és az üdítőre.","id":179},{"t":"Számításos mini-ZH I.","kind":"quiz","chapter":11,"question":"D=15 000−130P, S=70P−5000. Mekkora a hiány 80 Ft-os hatósági árnál?","options":["600 egység","2000 egység","4000 egység","4600 egység"],"answer":2,"why":"D(80)=4600, S(80)=600. Hiány = D−S = 4000 egység.","sub":"Piaci egyensúly","visual":null,"id":180,"notes":"D=15 000−130P, S=70P−5000. Mekkora a hiány 80 Ft-os hatósági árnál?"},{"t":"Számításos mini-ZH II.","kind":"quiz","chapter":11,"question":"I=20 000 Ft és Px=1000 Ft. Mekkora az X termék tengelymetszete?","options":["10","20","40","50"],"answer":1,"why":"Xmax=I/Px=20 000/1000=20 egység.","sub":"Költségvetési egyenes","visual":null,"id":181,"notes":"I=20 000 Ft és Px=1000 Ft. Mekkora az X termék tengelymetszete?"},{"t":"Számításos mini-ZH III.","kind":"qui function body(s){
 switch(s.kind){
 case 'cover': return `<div class="cover-flex"><div><div class="overline">INTERAKTÍV TANULÓTÉR</div><h1>Közgazdaságtan<em>alapjai.</em></h1><p class="lead">${esc(s.lead)}</p><div class="cover-meta">12 fejezet · részletes magyarázatok · interaktív gyakorlatok</div></div><div class="cover-art"><div class="orbit"><span class="orbit-center">μ</span><span class="orbit-tag t1">KERESLET × KÍNÁLAT</span><span class="orbit-tag t2">FOGYASZTÓI DÖNTÉS</span><span class="orbit-tag t3">KÖLTSÉG & PROFIT</span><span class="orbit-tag t4">PIACI EGYENSÚLY</span></div></div></div>`;
 case 'chapter':return `<div class="chapter-layout"><div class="chapter-text"><div class="eyebrow">${esc(s.sub)}</div><h1>${esc(s.t)}</h1><p class="lead">${esc(s.lead)}</p><div class="chapter-pills"><span>Fejezet ${esc(CHAPTERS[s.chapter].num)}</span><span>Tanulási fejezet</span></div></div><div class="chapter-no">${esc(CHAPTERS[s.chapter].num)}</div></div>`;
 case 'definition':return `<div class="body-two ${s.visual?'chart-heavy':''}"><div class="col-stack"><div class="definition-card"><div class="label">Definíció</div><p class="deftext">${esc(s.definition)}</p></div>${panel('Mit jelent ez egyszerűen?',s.explain)}${!s.visual?key(s):''}</div>${s.visual?`<div class="col-stack">${visualbox(s.visual)}${s.example?panel('Példa',s.example,'ex-panel'):''}${key(s)}</div>`:`<div class="col-stack">${panel('Életszerű példa',s.example,'ex-panel')}<div class="panel"><div class="label">Fogalmi iránytű</div><p class="prose muted">A kifejezés lényege egy mondatban: ${esc(s.key||s.definition)}</p></div></div>`}</div>`;
 case 'concept':return `<div class="slide-content">${s.lead?`<p class="lead">${esc(s.lead)}</p>`:''}<div class="body-two ${s.visual?'chart-heavy':''}"><div class="col-stack">${s.points?.length?`<div class="panel"><div class="label">Összefüggések, lépésről lépésre</div>${dots(s.points)}</div>`:''}${s.formula?`<div class="formula-strip">${esc(s.formula)}</div>`:''}${!s.visual&&s.example?panel('Példa',s.example,'ex-panel'):''}${!s.visual?key(s):''}</div><div class="col-stack">${s.visual?visualbox(s.visual):`<div class="panel"><div class="label">Hogyan alkalmazd?</div><p class="prose">${esc(s.example||s.lead)}</p></div>`}${s.visual&&s.example?panel('Példa',s.example,'ex-panel'):''}${s.visual?key(s):''}</div></div></div>`;
 case 'blocks':return `<div class="slide-content">${s.lead?`<p class="lead">${esc(s.lead)}</p>`:''}<div class="blocks-grid n${Math.min(s.blocks.length,5)}">${s.blocks.map(blockItem).join('')}</div>${key(s)}</div>`;
 case 'visual':return `<div class="body-two chart-heavy"><div class="col-stack"><p class="lead">${esc(s.lead)}</p>${s.points?.length?`<div class="panel"><div class="label">Hogyan olvasd az ábrát?</div>${dots(s.points)}</div>`:''}${key(s)}</div>${visualbox(s.visual)}</div>`;
 case 'formula':return `<div class="slide-content formula"><div class="formula-strip">${esc(s.formula)}</div>${s.lead?`<p class="lead">${esc(s.lead)}</p>`:''}<div class="formula-bottom"><div class="panel"><div class="label">Jelölések és értelmezés</div>${dots(s.points||[])}</div>${s.visual?visualbox(s.visual):panel('Kidolgozott példa',s.example,'ex-panel')}</div>${key(s)}</div>`;
 case 'worked':return `<div class="slide-content ${s.visual?'':'stepwide'}"><div class="worked-intro">${esc(s.problem)}</div><div class="${s.visual?'worked-two':'slide-content'}"><div class="col-stack"><ol class="steps">${(s.steps||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol>${s.conclusion?`<div class="key"><span class="star">=</span><span>${esc(s.conclusion)}</span></div>`:''}</div>${s.visual?visualbox(s.visual):''}</div></div>`;
 case 'quiz':return `<div class="slide-content"><p class="quizquestion">${esc(s.question)}</p><div class="quiz-options">${s.options.map((o,i)=>`<button class="answer-option" data-option="${i}" aria-label="${String.fromCharCode(65+i)} válasz: ${esc(o)}"><b>${String.fromCharCode(65+i)}</b><span>${esc(o)}</span></button>`).join('')}</div><div class="quiz-feedback" id="feedback"></div><p class="muted" style="font-size:1.03cqw;margin-top:auto">Válassz egy választ! A megoldás és magyarázat csak kattintás után jelenik meg.</p></div>`;
 case 'summary':return `<div class="slide-content">${s.lead?`<p class="lead">${esc(s.lead)}</p>`:''}<div class="summary-items ${s.points.length>7?'long':''}">${s.points.map((x,i)=>`<div class="sitem"><b>${String(i+1).padStart(2,'0')}</b><span>${esc(x)}</span></div>`).join('')}</div></div>`;
 case 'guide':return `<div class="slide-content"><p class="lead">${esc(s.lead)}</p><div class="summary-items">${s.points.map((x,i)=>`<div class="sitem"><b>${String(i+1).padStart(2,'0')}</b><span>${esc(x)}</span></div>`).join('')}</div>${key(s)}</div>`;
 case 'sources':return `<p class="lead">${esc(s.lead)}</p><div class="sources-list">${s.blocks.map(b=>blockItem([b[0],b[1],''])).join('')}</div>`;
 case 'outro':return `<div style="display:flex;flex-direction:column;justify-content:center;height:100%"><div class="eyebrow">${esc(s.sub)}</div><h1 style="font-size:6.5cqw;line-height:1.05;margin:2cqw 0">${esc(s.t)}<span style="color:var(--accent)">.</span></h1><p class="lead" style="font-size:2cqw;max-width:85%">${esc(s.lead)}</p><div style="margin-top:5cqw">${key(s)}</div></div>`;
 default:return '<p>Ismeretlen diatípus.</p>';
 }
}
function render(){let s=SLIDES[page], c=CHAPTERS[s.chapter],accent=c.accent;stage.style.setProperty('--accent',accent);stage.style.setProperty('--accent2',accent);let isFull=['cover','chapter','outro'].includes(s.kind);stage.innerHTML=`<article class="slide ${esc(s.kind)}"><div class="${isFull?'cover-fill':'title-row'}">${isFull?'':`<div class="slide-title"><div class="eyebrow"><span class="dot"></span>${esc(c.title)} ${s.kind==='quiz'?' / Önellenőrzés':''}</div><h1>${esc(s.t)}</h1><span class="accentline"></span></div><div class="slide-top-index">${String(page+1).padStart(3,'0')} / ${SLIDES.length}</div>`}</div><div class="slide-content" style="${isFull?'height:100%':''}">${body(s)}</div><div class="page-ornament"></div><div class="source-footer">KÖZGAZDASÁGTAN ALAPJAI</div></article>`;
 $('#chapterTag').textContent=`${c.num} / ${c.kicker}`;$('#currentChapter').textContent=c.title;$('#counter').textContent=`${page+1} / ${SLIDES.length}`;$('#progressFill').style.width=`${(page+1)/SLIDES.length*100}%`;$('#prevBtn').disabled=page===0;$('#nextBtn').disabled=page===SLIDES.length-1;
 $('#noteBody').textContent=(s.notes||s.lead||s.definition||'')+(s.example?'\n\nPélda: '+s.example:'');
 const qBtns=stage.querySelectorAll('[data-option]');if(qBtns.length){qBtns.forEach(b=>b.addEventListener('click',()=>answerQuiz(Number(b.dataset.option))));if(selected[page]!==undefined)paintQuiz(selected[page]);}
 if(s.visual)initLive(s.visual);
 if(!notes.classList.contains('open')){notes.classList.remove('open')};save();location.hash=`dia-${page+1}`;
}
function goto(i){i=Math.max(0,Math.min(i,SLIDES.length-1));if(i===page)return;page=i;render();stage.scrollTop=0}
function answerQuiz(choice){if(selected[page]!==undefined)return;selected[page]=choice;paintQuiz(choice);save()}
function paintQuiz(choice){const s=SLIDES[page],ok=choice===s.answer;stage.querySelectorAll('.answer-option').forEach(b=>{const v=Number(b.dataset.option);b.disabled=true;b.classList.add(v===s.answer?'correct':v===choice?'wrong':'dim')});const feed=$('#feedback',stage);feed.className='quiz-feedback show'+(ok?'':' wrong');feed.innerHTML=`<strong>${ok?'✓ Helyes válasz!':'✕ Nem ez a helyes válasz.'} (${String.fromCharCode(65+s.answer)})</strong>${esc(s.why)}`}
function showToc(show){toc.classList.toggle('open',show);if(show){$('#search').value='';drawIndex('');setTimeout(()=>$('#search').focus(),50)}}
function drawIndex(query){let str=query.trim().toLocaleLowerCase('hu');let parent=$('#chaptersList');parent.innerHTML='';if(str){let results=SLIDES.filter(s=>[s.t,s.definition,s.explain,s.lead,s.formula,s.key,s.question,s.problem,...(s.points||[])].join(' ').toLocaleLowerCase('hu').includes(str));$('#searchCount').textContent=`${results.length} találat a ${SLIDES.length} diából`;parent.innerHTML=results.map(s=>`<button class="nav-slide" data-goto="${s.id}"><b>${String(s.id+1).padStart(3,'0')}</b><span>${esc(s.t)}</span></button>`).join('')||'<p class="muted">Nincs találat.</p>';}
 else{$('#searchCount').textContent=`${SLIDES.length} dia • ${CHAPTERS.length-1} tematikus fejezet`;parent.innerHTML=CHAPTERS.map((c,i)=>`<button class="nav-chapter" data-goto="${c.at}"><b class="n">${c.num}</b><span><strong>${esc(c.title)}</strong><span class="desc">${esc(c.kicker)}</span></span></button>`).join('')};parent.querySelectorAll('[data-goto]').forEach(b=>b.addEventListener('click',()=>{goto(Number(b.dataset.goto));showToc(false)}))}
$('#tocBtn').addEventListener('click',()=>showToc(true));$('#tocClose').addEventListener('click',()=>showToc(false));toc.addEventListener('click',e=>{if(e.target===toc)showToc(false)});$('#search').addEventListener('input',e=>drawIndex(e.target.value));$('#notesBtn').addEventListener('click',()=>notes.classList.toggle('open'));$('#notesClose').addEventListener('click',()=>notes.classList.remove('open'));
$('#fullBtn').addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.()}else{document.exitFullscreen?.()}});
$('#helpBtn').addEventListener('click',()=>{showToc(true)});$('#prevBtn').addEventListener('click',()=>goto(page-1));$('#nextBtn').addEventListener('click',()=>goto(page+1));
document.addEventListener('keydown',e=>{const tag=document.activeElement?.tagName;if(tag==='INPUT'||tag==='TEXTAREA')return;if(toc.classList.contains('open')){if(e.key==='Escape')showToc(false);return}if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();goto(page+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();goto(page-1)}if(e.key==='Home'){e.preventDefault();goto(0)}if(e.key==='End'){e.preventDefault();goto(SLIDES.length-1)}if(e.key.toLowerCase()==='i'){showToc(true)}if(e.key.toLowerCase()==='n'){notes.classList.toggle('open')}if(e.key.toLowerCase()==='f'){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}if(e.key==='Escape')notes.classList.remove('open');if(e.key==='?')showToc(true)});
let touchX=null,touchY=null;stage.addEventListener('touchstart',e=>{if(e.target.closest('input,button'))return;touchX=e.touches[0].clientX;touchY=e.touches[0].clientY},{passive:true});stage.addEventListener('touchend',e=>{if(touchX==null)return;let dx=e.changedTouches[0].clientX-touchX,dy=e.changedTouches[0].clientY-touchY;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.3)goto(page+(dx<0?1:-1));touchX=null},{passive:true});

const NS='http://www.w3.org/2000/svg';
function svgBase(inner,caption=''){return `<svg viewBox="0 0 680 420" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(caption||'Közgazdasági diagram')}"><defs><pattern id="sg" width="39" height="39" patternUnits="userSpaceOnUse"><path d="M 39 0 L 0 0 0 39" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="3.5"/></filter></defs><rect width="680" height="420" fill="url(#sg)"/>${inner}</svg>`}
function line(x1,y1,x2,y2,color='#9db7c6',width=2,dash=''){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${width}" ${dash?'stroke-dasharray="'+dash+'"':''} stroke-linecap="round" />`}
function textSvg(x,y,t,color='#d9e7ef',size=15,anchor='start',weight=650){return `<text x="${x}" y="${y}" fill="${color}" font-size="${size}" text-anchor="${anchor}" font-family="Segoe UI,Arial,sans-serif" font-weight="${weight}">${esc(t)}</text>`}
function circle(x,y,r=6,color='#fff',stroke='#0a1b2c'){return `<circle cx="${x}" cy="${y}" r="${r}" fill="${color}" stroke="${stroke}" stroke-width="2.5"/>`}
function pathSvg(d,color='#64e4d6',width=4,dash='',fill='none'){return `<path d="${d}" fill="${fill}" stroke="${color}" stroke-width="${width}" stroke-linejoin="round" stroke-linecap="round" ${dash?'stroke-dasharray="'+dash+'"':''}/>`}
function poly(fun,a,b,mapX,mapY,n=72){return Array.from({length:n+1},(_,i)=>{let x=a+(b-a)*i/n,y=fun(x);return `${i?'L':'M'}${mapX(x).toFixed(1)},${mapY(y).toFixed(1)}`}).join(' ')}
function axes(x0=76,y0=347,x1=626,y1=48,xlab='Mennyiség (Q)',ylab='Ár / érték'){return `<path d="M${x0},${y1}V${y0}H${x1}" fill="none" stroke="#acc4d1" stroke-width="2.3"/>${textSvg(x1,y0+32,xlab,'#a8c3d2',16,'end')}${textSvg(x0-10,y1-17,ylab,'#a8c3d2',16)}`}
function tag(x,y,t,color='#64e4d6'){return `<rect x="${x-11}" y="${y-20}" width="${Math.max(56,t.length*8.1+22)}" height="27" rx="9" fill="#0b2635" stroke="${color}" stroke-opacity=".55"/>${textSvg(x,y-2,t,color,14)}`}
function visualbox(name){let isLive=['marketlive','budgetlive','firmlive'].includes(name);return `<div class="chartbox" data-viz="${name}">${chart(name)}${isLive?`<div class="ctrls" id="ctrl-${name}"></div>`:''}<div class="chart-caption">${chartCaption(name)}</div></div>`}

case 'opportunity':return svgBase(`<rect x="57" y="87" width="249" height="221" rx="22" fill="#154251" stroke="#64e4d680"/>${textSvg(181,131,'VÁLASZTÁS','#bffaf0',16,'middle')}${textSvg(181,204,'TANULÁS','#fff',34,'middle',850)}${textSvg(181,260,'+ vizsgafelkészülés','#a5c8d4',15,'middle')}<rect x="377" y="87" width="249" height="221" rx="22" fill="#503a3a" stroke="#f7bc7c80"/>${textSvg(502,131,'FELÁLDOZOTT','#fbd5a5',16,'middle')}${textSvg(502,204,'MUNKA','#fff',34,'middle',850)}${textSvg(502,260,'− elmaradt jövedelem','#dcb4a3',15,'middle')}${textSvg(344,206,'→','#64e4d6',35,'middle')}`, 'Alternatív költség');
case 'ppf':{let X=q=>85+q/100*505,Y=y=>345-y/100*270;let d=poly(x=>100*Math.sqrt(Math.max(0,1-(x/100)**2)),0,100,X,Y);return svgBase(axes(85,345,610,53,'Élelmiszer','Gépek')+`<path d="M85,345 L85,75 ${d.slice(1)} Z" fill="#52dcc60d"/>`+pathSvg(d,'#64e4d6',5)+circle(X(55),Y(83.5),7,'#f6c97e')+tag(X(55)+15,Y(83.5)-4,'Hatékony','#f6c97e')+circle(X(42),Y(36),7,'#ff9dad')+tag(X(42)+14,Y(36)-10,'Nem hatékony','#ff9dad')+circle(X(81),Y(89),7,'#8faeff')+tag(X(81)-58,Y(89)-12,'Nem elérhető','#8faeff'), 'Termelési lehetőségek határa')}
case 'circular':return svgBase(`<rect x="48" y="146" width="200" height="116" rx="20" fill="#153e4e" stroke="#70ddce99"/><rect x="430" y="146" width="200" height="116" rx="20" fill="#29365b" stroke="#90aaff99"/>${textSvg(148,191,'HÁZTARTÁSOK','#d9fff4',20,'middle')}${textSvg(530,191,'VÁLLALATOK','#e4eaff',20,'middle')}${textSvg(148,229,'fogyasztás • munka','#a7c6d7',14,'middle')}${textSvg(530,229,'termelés • bérek','#a7c6d7',14,'middle')}${pathSvg('M248,173 H425 M420,168 L427,173 L420,178','#64e4d6',4)}${textSvg(338,156,'ERŐFORRÁSOK','#64e4d6',14,'middle')}${pathSvg('M430,231 H254 M260,226 L251,231 L260,236','#f5c677',4)}${textSvg(338,258,'BÉR / JÖVEDELEM','#f5c677',14,'middle')}${pathSvg('M530,145 Q530,54 340,54 Q148,54 148,145','#9fb5ff',3)}${textSvg(338,39,'TERMÉKEK, SZOLGÁLTATÁSOK','#a6baff',14,'middle')}${pathSvg('M148,263 Q148,351 340,351 Q530,351 530,263','#fc9aaf',3)}${textSvg(338,384,'FOGYASZTÁSI KIADÁSOK','#f5b0bf',14,'middle')}`, 'Gazdasági körforgás');

case 'budgetlive':return makeBudget(20000,500,400,true);
case 'optimum':{let X=q=>88+q/16*490,Y=y=>347-y/14*278,b=q=>12-.8*q,u=q=>45/q;let q=7.5,y=6;return svgBase(axes(88,347,620,52,'X jószág','Y jószág')+pathSvg(poly(b,0,15,X,Y),'#f8bc77',4)+pathSvg(poly(u,3.6,14,X,Y),'#62e6d4',4)+pathSvg(poly(x=>55/x,4.3,14,X,Y),'#93a7ff',2,'7 6')+line(X(q),Y(y),X(q),347,'#fff7',1.5,'7 7')+circle(X(q),Y(y),7,'#fff')+tag(X(q)+17,Y(y)-7,'Optimum','#fff')+tag(X(13),Y(b(13))-13,'Korlát','#f8bc77'),'Fogyasztói optimum')}
case 'elasticity':{let x0=69,y0=350;let out=line(x0,75,x0,350)+line(x0,350,640,350);out+=textSvg(332,391,'Rugalmasabb','#80edd9',18,'middle')+textSvg(332,37,'Rugalmatlanabb → meredekebb','#f5c788',17,'middle');out+=pathSvg('M114,148 L361,310','#70e9d6',5)+pathSvg('M420,82 L505,327','#f5c178',5)+tag(155,139,'D₁','#70e9d6')+tag(454,113,'D₂','#f5c178');return svgBase(out,'Kereslet meredeksége és érzékenysége')}
case 'revenue':{let b1=70000/80000*240;let y0=344;return svgBase(axes(75,344,622,63,'Két állapot','Teljes bevétel (Ft)')+`<rect x="159" y="${y0-b1}" width="125" height="${b1}" rx="13" fill="#5adbd1" opacity=".85"/><rect x="397" y="${y0-b1}" width="125" height="${b1}" rx="13" fill="#f7bf72" opacity=".85"/>`+textSvg(222,y0-b1-20,'70 000 Ft','#d3fff2',20,'middle')+textSvg(459,y0-b1-20,'70 000 Ft','#fff0d0',20,'middle')+textSvg(222,371,'700 Ft × 100 db','#d2e4ee',15,'middle')+textSvg(460,371,'350 Ft × 200 db','#d2e4ee',15,'middle'),'Teljes árbevétel')}
case 'production':{let X=q=>76+q/30*520,Y=y=>347-y/105*280;return svgBase(axes(76,347,614,50,'Munka (L)','Kibocsátás (Q)')+pathSvg(poly(l=>100*(1-Math.exp(-.105*l)),0,30,X,Y),'#6de3d3',5)+line(X(18),Y(0),X(18),Y(100*(1-Math.exp(-.105*18))),'#e7f1f877',2,'5 7')+tag(377,114,'Csökkenő határtermék','#f4c77c'),'Termelési függvény')}
case 'costs':return makeCosts();
case 'longrun':{let X=q=>76+q/100*524,Y=c=>346-c/170*266,f=x=>50+.02*(x-50)**2;let out=axes(76,346,615,54,'Üzemméret / Q','Átlagköltség');for(let [center,color] of [[29,'#668caa'],[50,'#7a85af'],[72,'#5d7e9b']])out+=pathSvg(poly(x=>f(x)+.085*(x-center)**2,Math.max(7,center-23),Math.min(94,center+23),X,Y),color,2.3,'7 5');out+=pathSvg(poly(f,3,98,X,Y),'#66e2d4',5)+circle(X(50),Y(f(50)),7,'#fff')+tag(X(50)+15,Y(f(50))-13,'LAC minimum','#65e1d4');return svgBase(out,'Hosszú távú átlagköltség')}
case 'firm':{let X=q=>76+q/100*520,Y=p=>348-p/150*273;return svgBase(axes(76,348,613,50,'Cég kibocsátása','Ár / MR')+line(X(0),Y(88),X(100),Y(88),'#63e7d6',4)+tag(418,Y(88)-13,'P = MR','#63e7d6'),'Árelfogadó vállalat')}
case 'firmlive':return makeFirm(100);
case 'timescales':{let out=axes(76,351,625,52,'Mennyiség','Ár');out+=line(278,85,278,350,'#f7c176',4)+pathSvg('M360,330 Q424,220 545,88','#6ce4d5',5)+pathSvg('M130,95 L563,305','#9ba8f9',4);out+=tag(211,113,'Pillanatnyi S','#f7c176')+tag(457,104,'Rövid távú S','#6ce4d5')+tag(142,103,'D','#9ba8f9');return svgBase(out,'Eltérő kínálati időtávok')}
case 'monopoly':{let X=q=>75+q/78*522,Y=p=>347-p/200*282,dd=q=>180-2*q,mr=q=>180-4*q,mc=q=>40+q;let qM=28,pM=124,qC=140/3,pC=180-2*qC;return svgBase(axes(75,347,619,53)+pathSvg(poly(dd,0,78,X,Y),'#f6ba73',4)+pathSvg(poly(mr,0,45,X,Y),'#8fa7ff',3)+pathSvg(poly(mc,0,78,X,Y),'#64e4d6',4)+line(X(qM),Y(pM),X(qM),347,'#ffffff80',1.6,'6 6')+line(75,Y(pM),X(qM),Y(pM),'#ffffff80',1.6,'6 6')+circle(X(qM),Y(mc(qM)),7,'#fff')+circle(X(qM),Y(pM),7,'#f8c578')+tag(X(qM)+17,Y(pM)-12,'Monopolár P*','#f8c578')+tag(530,95,'D','#f6ba73')+tag(287,245,'MR','#8fa7ff')+tag(540,200,'MC','#64e4d6')+textSvg(X(qM),374,'Q*','#f6d8a0',15,'middle'),'Monopólium optimális mennyiség és ár')}
}return svgBase(textSvg(300,205,'Szemléltető ábra','#a7d7dc',22,'middle'),'Ábra')}
function makeMarket(p){let X=q=>80+q/6500*508,Y=pr=>350-(pr-65)/(125-65)*280;let demand=pr=>15000-130*pr,supply=pr=>70*pr-5000,qe=2000,qD=demand(p),qS=supply(p),gap=qD-qS;let out=axes(80,350,619,51,'Mennyiség (db)','Ár (Ft)');out+=pathSvg(poly(q=>(15000-q)/130,0,6500,X,Y),'#ffc976',4);out+=pathSvg(poly(q=>(q+5000)/70,0,3750,X,Y),'#6ae7d7',4);out+=line(80,Y(p),X(6200),Y(p),'#e8eefbb2',1.7,'8 6');out+=line(X(qe),Y(100),X(qe),350,'#ffffff55',1.4,'6 6');out+=circle(X(qe),Y(100),6,'#fff');out+=circle(X(qD),Y(p),7,'#ffc976');out+=circle(X(qS),Y(p),7,'#64e4d6');out+=tag(X(qD)-45,Y(p)-17,'D: '+Math.round(qD),'#ffc976')+tag(X(qS)-20,Y(p)+34,'S: '+Math.round(qS),'#64e4d6');out+=textSvg(70,Y(100)+5,'100','#b3c8d9',14,'end')+textSvg(70,Y(p)+5,String(p),'#e8efff',15,'end');out+=textSvg(594,64,gap>0?'HIÁNY: '+Math.round(gap):gap<0?'TÖBBLET: '+Math.round(-gap):'EGYENSÚLY',gap>0?'#ffbc8b':gap<0?'#98b8fd':'#71e6d5',16,'end');return svgBase(out,'Piaci egyensúly kalkulátor')}
function makeBudget(I,px,py,compare){let xmax=I/px,ymax=I/py;let scaleX=Math.max(44,xmax*1.08),scaleY=Math.max(55,ymax*1.08);let X=q=>77+q/scaleX*513,Y=q=>347-q/scaleY*265;let out=axes(77,347,618,52,'X termék','Y termék');if(compare){out+=pathSvg(`M${X(0)},${Y(50)} L${X(40)},${Y(0)}`,'#ffffff78',2,'9 7')};out+=pathSvg(`M${X(0)},${Y(ymax)} L${X(xmax)},${Y(0)}`,'#65e5d9',5)+circle(X(0),Y(ymax),6,'#f6c579')+circle(X(xmax),Y(0),6,'#f6c579');out+=textSvg(X(0)+13,Y(ymax)-12,`Ymax ${ymax.toFixed(1)}`,'#e7f4ee',16);out+=textSvg(X(xmax),375,`Xmax ${xmax.toFixed(1)}`,'#e7f4ee',16,'middle');out+=textSvg(596,70,`I = ${I.toLocaleString('hu-HU')} Ft`,'#b3dbd9',16,'end');out+=textSvg(596,100,`Meredekség: −${(px/py).toFixed(2)}`,'#a7bcce',15,'end');return svgBase(out,'Költségvetési korlát')}
function makeCosts(){let FC=1500, VC=q=>120*q-8*q*q+.2*q*q*q,MC=q=>120-16*q+.6*q*q,AVC=q=>VC(q)/q,AC=q=>(FC+VC(q))/q;let X=q=>78+(q-5)/32*517,Y=c=>347-c/230*273;let out=axes(78,347,617,50,'Kibocsátás (Q)','Költség / db');for(let [f,name,col] of [[MC,'MC','#67eadb'],[AVC,'AVC','#f8c479'],[AC,'AC','#a3b1ff']]){out+=pathSvg(poly(q=>Math.min(250,Math.max(0,f(q))),5,37,X,Y),col,3.7);let pos=name==='MC'?35:name==='AVC'?18:10;out+=tag(Math.min(556,X(pos)),Y(Math.min(225,f(pos)))-12,name,col)}let qAv=20,pAv=40;out+=circle(X(qAv),Y(pAv),7,'#ffcd7a');out+=tag(X(qAv)+14,Y(pAv)-8,'Ü','#f8c479');return svgBase(out,'AC, AVC és MC költséggörbék')}
function makeFirm(p){let FC=1500,VC=q=>120*q-8*q*q+.2*q*q*q,MC=q=>120-16*q+.6*q*q;let disc=256-2.4*(120-p),q=(16+Math.sqrt(Math.max(0,disc)))/1.2;let profit=p*q-(FC+VC(q));let X=q=>76+q/39*510,Y=c=>347-c/210*274;let out=axes(76,347,614,50,'Kibocsátás (Q)','Ár, MC (Ft)');out+=pathSvg(poly(q=>Math.min(210,Math.max(0,MC(q))),0,37,X,Y),'#67e4d9',4);out+=line(X(0),Y(p),X(39),Y(p),'#f7c879',3,'10 5')+line(X(q),Y(p),X(q),347,'#ffffff70',1.7,'6 6')+circle(X(q),Y(p),8,'#fff');out+=tag(X(q)+13,Y(p)-9,`Q* ${q.toFixed(1)}`,'#f9c879');out+=tag(430,78,profit>=0?'Profit: '+Math.round(profit)+' Ft':'Veszteség: '+Math.round(-profit)+' Ft',profit>=0?'#6ae7d9':'#ff9dad');out+=tag(120,Y(p)-10,'P = MR','#f7c879');return svgBase(out,'Kompetitív vállalat optimuma')}
function initLive(name){const ctr=$('#ctrl-'+name,stage);if(!ctr)return;const params={marketlive:[['Ár (P)','p',75,120,5,100,'Ft']],budgetlive:[['Jövedelem','i',12000,32000,2000,20000,'Ft'],['X ára','px',250,1000,50,500,'Ft'],['Y ára','py',200,900,50,400,'Ft']],firmlive:[['Piaci ár','p',55,160,5,100,'Ft']]}[name];if(!params)return;let state=Object.fromEntries(params.map(p=>[p[1],p[5]]));ctr.innerHTML=params.map(([label,k,min,max,step,value,unit])=>`<div class="ctrl"><label for="ctrl-${k}">${esc(label)}</label><input type="range" id="ctrl-${k}" data-key="${k}" min="${min}" max="${max}" step="${step}" value="${value}"><output id="out-${k}">${Number(value).toLocaleString('hu-HU')} ${unit}</output></div>`).join('');ctr.querySelectorAll('input').forEach(b=>b.addEventListener('input',()=>{state[b.dataset.key]=+b.value;ctr.querySelector('#out-'+b.dataset.key).textContent=Number(b.value).toLocaleString('hu-HU')+' Ft';const box=ctr.parentElement;const svg=box.querySelector('svg');svg.outerHTML=name==='marketlive'?makeMarket(state.p):name==='budgetlive'?makeBudget(state.i,state.px,state.py,true):makeFirm(state.p)}))}
try{let hash=location.hash.match(/^#dia-(\d+)/);if(hash)page=Math.max(0,Math.min(SLIDES.length-1,Number(hash[1])-1))}catch(e){}
render();drawIndex('');
