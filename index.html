 vizsgálja.","visual":null,"notes":"Hiányérzet, amely a hiány megszüntetésére irányuló cselekvésre késztet. A szükséglet nem kizárólag termék iránti vágy: lehet pihenés, biztonság, tudás vagy szabadidő is. A szükségletek versenyeznek a rendelkezésünkre álló erőforrásokért.","id":3},{"t":"Szűkösség","kind":"definition","chapter":1,"definition":"A korlátlan szükségletek és a korlátozott erőforrások együttes jelenléte.","explain":"Nem azt jelenti, hogy mindenből nagyon kevés van, hanem azt, hogy nem tudunk egyszerre minden igényt korlátlanul kielégíteni. A döntés ezért elkerülhetetlen.","example":"Van 20 000 Ft-od és szombaton 4 szabad órád. Több mindent szeretnél venni és csinálni, mint amit a kereted enged.","key":"Szűkösség → választás → lemondás.","visual":"scarcity","notes":"A korlátlan szükségletek és a korlátozott erőforrások együttes jelenléte. Nem azt jelenti, hogy mindenből nagyon kevés van, hanem azt, hogy nem tudunk egyszerre minden igényt korlátlanul kielégíteni. A döntés ezért elkerülhetetlen.","id":4},{"t":"Szabad javak és gazdasági javak","kind":"blocks","chapter":1,"blocks":[["Szabad javak","Az alapmodell szerint korlátlan mennyiségben rendelkezésre álló javak.","Például elméleti egyszerűsítésben a természetes levegő."],["Gazdasági javak","Korlátozott mennyiségben elérhető javak, ezért gazdálkodni kell velük.","Élelmiszer, energia, lakás, gépek, munkavégzés."]],"lead":"A szűkösség dönti el, mi válik gazdasági kérdéssé.","key":"Ugyanaz a jószág helyzettől függően lehet szabadnak tekintett vagy szűkös is.","notes":"A szűkösség dönti el, mi válik gazdasági kérdéssé. Ugyanaz a jószág helyzettől függően lehet szabadnak tekintett vagy szűkös is.","id":5},{"t":"Hasznosság","kind":"definition","chapter":1,"definition":"Az az elégedettség vagy érték, amelyet egy jószág egy adott ember szükségletének kielégítésével jelent.","explain":"A hasznosság szubjektív: ugyanazt a terméket különböző emberek eltérően értékelhetik. Döntéskor a várt hasznosságot vetjük össze bbé, ha az számodra többet ér.","formula":"","id":8},{"t":"Határelemzés","kind":"definition","chapter":1,"definition":"Egy döntés kicsi, egységnyi változásának többlethasznát és többletköltségét vizsgáló módszer.","explain":"Nem azt kérdezi, hogy „jó-e egyáltalán” a tevékenység, hanem hogy megéri-e még egy egységgel növelni.","example":"Érdemes-e még 1 órát túlórázni, ha utána lényegesen fáradtabb leszel?","key":"Az utolsó egység számít: határhaszon vs. határköltség.","visual":null,"notes":"Egy döntés kicsi, egységnyi változásának többlethasznát és többletköltségét vizsgáló módszer. Nem azt kérdezi, hogy „jó-e egyáltalán” a tevékenység, hanem hogy megéri-e még egy egységgel növelni.","id":9},{"t":"A termelési lehetőségek határa","kind":"visual","chapter":1,"visual":"ppf","lead":"A TLH/PPF-görbe megmutatja a két termékből maximálisan elérhető kombinációkat adott erőforrás és technológia mellett.","points":["A görbén: hatékony termelés.","A görbén belül: kihasználatlan erőforrás vagy nem hatékony felhasználás.","A görbén kívül: a jelenlegi adottságok mellett nem elérhető."],"key":"A görbe elmozdulhat technológiai fejlődéssel vagy erőforrásbővüléssel.","notes":"A TLH/PPF-görbe megmutatja a két termékből maximálisan elérhető kombinációkat adott erőforrás és technológia mellett. A görbe elmozdulhat technológiai fejlődéssel vagy erőforrásbővüléssel.","example":"","id":10},{"t":"Növekvő alternatív költség","kind":"concept","chapter":1,"lead":"A PPF jellemzően kifelé domborodó: ahogy többet termelünk egy termékből, egyre több másik termékről kell lemondanunk.","points":["Az erőforrások nem egyformán alkalmasak minden termék előállítására.","A speciálisan egy termékre alkalmas erőforrás átcsoportosítása egyre költségesebb.","A csökkenő hozadék elve is összekapcsolódik ezzel a szemlélettel."],"example":"Ha a termőföldek egyre kevésbé alkalmasak búzára, a búzatermelés további növelése egyre több más termék kiesésével jár.","key":"A görbe meredeksége a lemondási arányt mutatja.","visual":"ppf","notes":"A PPF jellemzően kifelé domborodó: ahogy többet termelünk egy termékből, egyre több másik termékről kell lemondanunk. Ha a termőföldek egyre kevésbé alkalmasak búzára, a búzatermelés további növelése egyre több más termék kiesésével jár.","formula":"","id":11},{"t":"Gyors ellenőrzés","kind":"quiz","chapter":1,"question":"Mi az alternatív költség?","options":["A megvett termék számlán szereplő ára","Az összes elképzelhető lehetőség összege","A feláldozott legjobb alternatíva értéke","A döntésből biztosan származó nyereség"],"answer":2,"why":"Egy döntésnél a legjobb kihagyott lehetőség hasznáról mondunk le. A kifizetett pénz ettől külön is értelmezhető költség.","sub":"Fogalmi alap","visual":null,"id":12,"notes":"Mi az alternatív költség?"},{"t":"Mit tanultunk az első fejezetben?","kind":"summary","chapter":1,"lead":"","points":["A szükséglet hiányérzet; a szűkösség az erőforrások korlátossága.","A döntésekben hasznosságot és költséget hasonlítunk össze.","Az alternatív költség a legjobb feláldozott lehetőség értéke.","A határelemzés a következő egységre kérdez rá.","A PPF elválasztja a hatékony, nem hatékony és jelenleg elérhetetlen kombinációkat."],"id":13,"notes":""},{"t":"Intézmények és a gazdaság körforgása","kind":"chapter","chapter":2,"sub":"KIK ÉS HOGYAN SZERVEZNEK?","lead":"Tulajdonjogok, gazdasági szereplők, koordináció, erőforráspiacok és logisztikai kapcsolatok.","id":14,"notes":"Tulajdonjogok, gazdasági szereplők, koordináció, erőforráspiacok és logisztikai kapcsolatok."},{"t":"Tulajdonjogok","kind":"definition","chapter":2,"definition":"A javakhoz való hozzájutást és azok feletti rendelkezést szabályozó, emberek közötti viszonyok.","explain":"A tulajdonosi jogok kiosztása meghatározza, ki használhat, alakíthat át, hasznosíthat vagy adhat el egy vagyontárgyat — és milyen ösztönzők mellett.","example":"Egy raktárépület tulajdonosa kiadhatja bérbe, eladhatja vagy átalakíthatja, ha a jogszabályi feltételek teljesülnek.","key":"A tulajdon nem pusztán birtoklás: jogok együttese.","visual":null,"notes":"A javakhoz való hozzájutást és azok feletti rendelkezést szabályozó, emberek közötti viszonyok. A tulajdonosi jogok kiosztása meghatározza, ki használhat, alakíthat át, hasznosíthat vagy adhat el egy vagyontárgyat — és milyen ösztönzők mellett.","id":15},{"t":"A tulajdonjog négy eleme","kind":"blocks","chapter":2,"blocks":[["Használat joga","A dolgot igénybe veheted.","Például munkára használod a gépet."],["Haszon elsajátítása","A használatból származó hozamot megkaphatod.","Például bérleti díjat kapsz."],["Megváltoztatás joga","Átalakíthatod vagy fejlesztheted a dolgot.","Például korszerűsíted az épületet."],["Elidegenítés joga","Másnak átadhatod a tulajdont.","Például eladod a részvényedet."]],"lead":"","key":"Az ösztönzési rendszer a tulajdonjogok szerkezetétől függ.","notes":"Az ösztönzési rendszer a tulajdonjogok szerkezetétől függ.","id":16},{"t":"Tulajdonformák","kind":"blocks","chapter":2,"blocks":[["Magántulajdon","Magánszemély vagy magánszervezet rendelkezik vele.","Egyéni és társas vállalkozások."],["Köztulajdon","Közösségi, állami vagy önkormányzati tulajdon.","Állami infrastruktúra."],["Szövetkezeti forma","A tagok közös tulajdonosi, működtetési érdekei jelennek meg.","Termelői szövetkezet."]],"lead":"A PDF felsorolja a magán- és köztulajdon több történeti és intézményi változatát.","key":"","notes":"A PDF felsorolja a magán- és köztulajdon több történeti és intézményi változatát.","id":17},{"t":"A gazdaság három fő szereplője","kind":"blocks","chapter":2,"blocks":[["Háztartások","Elsősorban fogyasztanak, munkát és más tényezőket kínálnak.","Jövedelmükből fogyasztanak vagy megtakarítanak."],["Vállalatok","Termelési tényezőkből javakat és szolgáltatásokat állítanak elő.","Munkaerőt alkalmaznak, árut értékesítenek."],["Állam","Közhatalmi és gazdasági feladatokat lát el.","Szabályoz, közjavakat biztosít, újraeloszt."]],"lead":"","key":"A szereplők a termék- és tényezőpiacokon kapcsolódnak össze.","notes":"A szereplők a termék- és tényezőpiacokon kapcsolódnak össze.","id":18},{"t":"Az állam három gazdasági funkciója","kind":"concept","chapter":2,"lead":"A tananyag az állam szerepét három fő csoportban rendszerezi.","points":["Allokáció és társadalmi hatékonyság: közjavak, környezet, monopóliumok.","Makrogazdasági stabilizáció: ingadozások csillapítása, növekedés támogatása.","Jövedelem-újraelosztás: társadalmi igazságossági célok."],"example":"A környezetszennyezés korlátozása allokációs feladat; a recesszió kezelése stabilizációs feladat.","key":"Az állam egyszerre szabályozó és gazdasági szereplő.","visual":null,"notes":"A tananyag az állam szerepét három fő csoportban rendszerezi. A környezetszennyezés korlátozása allokációs feladat; a recesszió kezelése stabilizációs feladat.","formula":"","id":19},{"t":"Gazdasági koordináció","kind":"definition","chapter":2,"definition":"A specializált gazdasági szereplők tevékenységének összehangolása.","explain":"A munkamegosztás miatt nincs olyan szereplő, aki mindent egyedül állít elő. Információra és szabályokra van szükség ahhoz, hogy a termelés és a fogyasztás találkozzon.","example":"A boltok megrendelései, a raktárkészletek, a beszállítói ütemezés és a fogyasztói kereslet összehangolása.","key":"Három alaptípus: piaci, centralizált és vegyes.","visual":null,"notes":"A specializált gazdasági szereplők tevékenységének összehangolása. A munkamegosztás miatt nincs olyan szereplő, aki mindent egyedül állít elő. Információra és szabályokra van szükség ahhoz, hogy a termelés és a fogyasztás találkozzon.","id":20},{"t":"A koordináció három rendszere","kind":"blocks","chapter":2,"blocks":[["Piaci","Árak, önkéntes cserék és szerződések szervezik.","A szereplők többnyire egyenrangúak."],["Centralizált","Központi terv és utasítás rendezi a folyamatokat.","Alá-fölérendeltség, korlátozott szerződési szabadság."],["Vegyes","A piac és az állami beavatkozás együtt van jelen.","A piac meghatározó, az állam szabályoz."]],"lead":"","key":"A mai gazdaságokban a vegyes koordináció jellemző.","notes":"A mai gazdaságokban a vegyes koordináció jellemző.","id":21},{"t":"A spontán piaci koordináció logikája","kind":"concept","chapter":2,"lead":"A piaci rendszerben az árak és a jövedelmezőség információt közvetítenek.","points":["Növekvő kereslet → az ár emelkedhet.","Magasabb várható nyereség → több termelőt vagy nagyobb kínálatot ösztönözhet.","Nagyobb kínálat → az ár ismét alkalmazkodhat."],"example":"Ha egy termék iránt hirtelen megnő az igény, a magasabb ár többletbeszerzést tehet vonzóvá.","key":"Az ár jelzés és ösztönző is.","visual":null,"notes":"A piaci rendszerben az árak és a jövedelmezőség információt közvetítenek. Ha egy termék iránt hirtelen megnő az igény, a magasabb ár többletbeszerzést tehet vonzóvá.","formula":"","id":22},{"t":"Termelési tényezők és jövedelmeik","kind":"blocks","chapter":2,"blocks":[["Munka","Emberi munkavégzés, képességek használata.","Jövedelme: munkabér."],["Tőke","A termeléshez használt előállított eszközök.","Jövedelme: tőkekamat / bérleti díj."],["Föld","Természeti erőforrás vagy termőterület.","Jövedelme: földjáradék."],["Emberi tőke","Tudás, készségek, amelyek lehetővé teszik és javítják a munkát.","Képzés, tapasztalat, szakértelem."]],"lead":"","key":"Tényezőpiacon az erőforrások szolgáltatásai cserélnek gazdát.","notes":"Tényezőpiacon az erőforrások szolgáltatásai cserélnek gazdát.","id":23},{"t":"A gazdasági körforgás","kind":"visual","chapter":2,"visual":"circular","lead":"Az egyszerű kétszereplős modell megmutatja, hogyan áramolnak a termékek, a termelési tényezők és a pénz a háztartások és a vállalatok között.","points":["Háztartás → vállalat: munka és egyéb erőforrások.","Vállalat → háztartás: bér és más jövedelmek.","Vállalat → háztartás: késztermékek és szolgáltatások.","Háztartás → vállalat: fogyasztási kiadás."],"key":"A reáláramlás és a pénzáramlás egymással összefügg.","notes":"Az egyszerű kétszereplős modell megmutatja, hogyan áramolnak a termékek, a termelési tényezők és a pénz a háztartások és a vállalatok között. A reáláramlás és a pénzáramlás egymással összefügg.","example":"","id":24},{"t":"Logisztika a gazdasági körforgásban","kind":"concept","chapter":2,"lead":"A PDF külön ábrázolja a fogyasztói cikkek beszerzését, értékesítését és újrahasznosítását.","points":["Vevői igény → kereskedő → beszállítói megrendelés.","Beszerzés és készletezés → a kereslethez szükséges rendelkezésre állás.","Értékesítési logisztika → a termék eljuttatása a vevőhöz.","Újrahasznosítási logisztika → visszaáramlás, kezelés."],"example":"Egy áruhiányt nem feltétlenül a termék hiánya, hanem koordinációs vagy szállítási hiba is okozhat.","key":"A logisztika a piac működésének része.","visual":null,"notes":"A PDF külön ábrázolja a fogyasztói cikkek beszerzését, értékesítését és újrahasznosítását. Egy áruhiányt nem feltétlenül a termék hiánya, hanem koordinációs vagy szállítási hiba is okozhat.","formula":"","id":25},{"t":"A közgazdaságtan öt fő kérdése","kind":"blocks","chapter":2,"blocks":[["01","Mit termeljünk?","Mely javakra fordítsunk erőforrásokat?"],["02","Mennyit termeljünk?","Mennyi kibocsátás célszerű?"],["03","Kinek termeljünk?","Hogyan oszlik el az előállított jószág?"],["04","Milyen áron?","Milyen cserearányok alakulnak ki?"],["05","Milyen állami szereppel?","Mikor indokolt a szabályozás?"]],"lead":"","key":"A következő fejezetek ezeknek a kérdéseknek adnak modellalapú válaszokat.","notes":"A következő fejezetek ezeknek a kérdéseknek adnak modellalapú válaszokat.","id":26},{"t":"Fejezetellenőrzés","kind":"quiz","chapter":2,"question":"Melyik piacon kínálják a háztartások a munkájukat?","options":["Fogyasztási cikkek piacán","Termelési tényezők piacán","Kizárólag az állami piacon","A monopóliumok piacán"],"answer":1,"why":"A munkavégzés a vállalat által igénybe vett termelési tényező; a háztartás ezért jövedelmet, jellemzően bért kap.","sub":"Gazdasági körforgás","visual":null,"id":27,"notes":"Melyik piacon kínálják a háztartások a munkájukat?"},{"t":"A piac és az egyensúly","kind":"chapter","chapter":3,"sub":"KERESLET TALÁLKOZIK A KÍNÁLATTAL","lead":"Piaci mechanizmus, Marshall-kereszt, többlet, hiány és hatósági ár.","id":28,"notes":"Piaci mechanizmus, Marshall-kereszt, többlet, hiány és hatósági ár."},{"t":"Piac","kind":"definition","chapter":3,"definition":"Olyan tényleges vagy virtuális kapcsolatrendszer, ahol vevők és eladók cserekapcsolatot létesítenek, és árak alakulnak ki.","explain":"A piac nem csak fizikai hely. Egy webáruház és egy tőzsdei kereskedési rendszer is piacnak tekinthető. A mikroökonómia a termékeket és szolgáltatásokat gyakran „jószágoknak” nevezi.","example":"Egy élelmiszerpiacon több eladó kínál hasonló terméket, a vevők pedig összehasonlítják az árakat.","key":"A piac a kereslet és kínálat találkozásának intézménye.","visual":null,"notes":"Olyan tényleges vagy virtuális kapcsolatrendszer, ahol vevők és eladók cserekapcsolatot létesítenek, és árak alakulnak ki. A piac nem csak fizikai hely. Egy webáruház és egy tőzsdei kereskedési rendszer is piacnak tekinthető. A mikroökonómia a termékeket és szolgáltatásokat gyakran „jószágoknak” nevezi.","id":29},{"t":"Rezervációs ár","kind":"definition","chapter":3,"definition":"A legmagasabb ár, amelyet egy fogyasztó még hajlandó megfizetni az adott jószágért.","explain":"A rezervációs árnál a fogyasztó a vásárlás és a lemondás között közömbös. Ettől függ, hogy egy adott piaci ár mellett vásárolni szeretne-e.","example":"Egy koncertjegy neked legfeljebb 12 000 Ft-ot ér. Ha 15 000 Ft, lemondasz róla.","key":"A rezervációs ár egyéni értékítélet.","visual":null,"notes":"A legmagasabb ár, amelyet egy fogyasztó még hajlandó megfizetni az adott jószágért. A rezervációs árnál a fogyasztó a vásárlás és a lemondás között közömbös. Ettől függ, hogy egy adott piaci ár mellett vásárolni szeretne-e.","id":30},{"t":"Piaci működés: három alapgondolat","kind":"blocks","chapter":3,"blocks":[["Optimalizáció","A fogyasztók és termelők saját céljaiknak megfelelő döntést keresnek.","Választás a lehetőségek között."],["Egyensúly","Az ár a keresett és kínált mennyiség egyezése felé igazodhat.","D = S."],["Rezervációs ár","A fogyasztó fizetési hajlandóságának felső határa.","Mennyit ér nekem?"]],"lead":"","key":"A kereslet és kínálat modellje ezekre a gondolatokra épül.","notes":"A kereslet és kínálat modellje ezekre a gondolatokra épül.","id":31},{"t":"Kereslet (D)","kind":"definition","chapter":3,"definition":"Adott árak és jövedelem mellett egy konkrét jószág megvásárlására irányuló fizetőképes szándék.","explain":"A szükséglet még nem egyenlő a piaci kereslettel: csak akkor jelenik meg keresletként, ha a fogyasztó hajlandó és képes fizetni.","example":"Szeretnél új autót, de nincs rá pénzed: ez szükséglet vagy vágy, de a modellben nem feltétlenül fizetőképes kereslet.","key":"A kereslet mennyisége általában csökken, ha az ár nő.","visual":null,"notes":"Adott árak és jövedelem mellett egy konkrét jószág megvásárlására irányuló fizetőképes szándék. A szükséglet még nem egyenlő a piaci kereslettel: csak akkor jelenik meg keresletként, ha a fogyasztó hajlandó és képes fizetni.","id":32},{"t":"Kínálat (S)","kind":"definition","chapter":3,"definition":"Az a mennyiség, amelyet a termelők különböző árakon eladásra felkínálnak.","explain":"Más tényezők változatlanságával a magasabb ár rendszerint nagyobb kínálatot tesz jövedelmezővé. A kínálat alakját a termelési költség és a termelők száma is befolyásolja.","example":"Ha a szamóca ára emelkedik, több termelőnek érheti meg eladásra szállítani.","key":"Tipikus kínálati görbe: pozitív meredekség.","visual":null,"notes":"Az a mennyiség, amelyet a termelők különböző árakon eladásra felkínálnak. Más tényezők változatlanságával a magasabb ár rendszerint nagyobb kínálatot tesz jövedelmezővé. A kínálat alakját a termelési költség és a termelők száma is befolyásolja.","id":33},{"t":"Marshall-kereszt: a két görbe","kind":"visual","chapter":3,"visual":"supply","lead":"A keresleti görbe lefelé, a kínálati felfelé tart. Metszéspontjuk a piaci egyensúly.","points":["Függőleges tengely: ár (P).","Vízszintes tengely: mennyiség (Q).","D: kereslet; S: kínálat."],"key":"A piaci ár alaphelyzetben a metszéspont felé alkalmazkodhat.","notes":"A keresleti görbe lefelé, a kínálati felfelé tart. Metszéspontjuk a piaci egyensúly. A piaci ár alaphelyzetben a metszéspont felé alkalmazkodhat.","example":"","id":34},{"t":"Egyensúlyi ár és mennyiség","kind":"definition","chapter":3,"definition":"Az az ár (P*), amelynél a keresett mennyiség egyenlő a kínált mennyiséggel; a közös mennyiség Q*.","explain":"A metszéspontban a keresők szándékolt vásárlása megfelel az eladók szándékolt értékesítésének. Ez a modell „piactisztító” állapota.","example":"Ha 100 Ft-os árnál 2000 terméket vásárolnának és 2000-et kínálnának, a piac egyensúlyban van.","key":"D(P*) = S(P*).","visual":"supply","notes":"Az az ár (P*), amelynél a keresett mennyiség egyenlő a kínált mennyiséggel; a közös mennyiség Q*. A metszéspontban a keresők szándékolt vásárlása megfelel az eladók szándékolt értékesítésének. Ez a modell „piactisztító” állapota.","id":35},{"t":"Hiány és többlet","kind":"definition","chapter":3,"definition":"Hiány (túlkereslet): a kereslet nagyobb a kínálatnál. Többlet (túlkínálat): a kínálat nagyobb a keresletnél.","explain":"Az egyensúlyinál alacsonyabb árszint gyakran hiányt, a magasabb pedig túlkínálatot eredményez. A grafikonon a két görbe vízszintes távolsága adja a különbséget.","example":"Alacsony, rögzített termékár mellett elfogyhat a készlet, miközben sokan vásárolnának.","key":"Hiány: D>S. Többlet: S>D.","visual":"supply","notes":"Hiány (túlkereslet): a kereslet nagyobb a kínálatnál. Többlet (túlkínálat): a kínálat nagyobb a keresletnél. Az egyensúlyinál alacsonyabb árszint gyakran hiányt, a magasabb pedig túlkínálatot eredményez. A grafikonon a két görbe vízszintes távolsága adja a különbséget.","id":36},{"t":"Interaktív piac: változtasd meg az árat!","kind":"visual","chapter":3,"visual":"marketlive","lead":"A csúszkával állítsd be az árat. A program az eredeti számítási feladat keresleti és kínálati függvényeit használja.","points":["Kereslet: D = 15 000 − 130P.","Kínálat: S = 70P − 5 000.","Egyensúly: P* = 100 Ft, Q* = 2000 db."],"key":"80 Ft-nál 4000 darabos hiány keletkezik.","notes":"A csúszkával állítsd be az árat. A program az eredeti számítási feladat keresleti és kínálati függvényeit használja. 80 Ft-nál 4000 darabos hiány keletkezik.","example":"","id":37},{"t":"Számítás: egyensúlyi ár","kind":"worked","chapter":3,"problem":"D = 15 000 − 130P és S = 70P − 5000. Határozzuk meg P* és Q* értékét!","steps":["Egyensúlyi feltétel: D = S.","15 000 − 130P = 70P − 5 000.","20 000 = 200P, tehát P* = 100 Ft.","Q* = 15 000 − 130 × 100 = 2000 db."],"conclusion":"Az egyensúly 100 Ft és 2000 darab.","visual":"supply","notes":"D = 15 000 − 130P és S = 70P − 5000. Határozzuk meg P* és Q* értékét!","id":38},{"t":"Számítás: hatósági ár 80 Ft","kind":"worked","chapter":3,"problem":"A hatóság legfeljebb 80 Ft-os árat engedélyez. Mi történik a fenti piacon?","steps":["Keresett mennyiség: D(80) = 15 000 − 130 × 80 = 4600.","Kínált mennyiség: S(80) = 70 × 80 − 5000 = 600.","Hiány = D − S = 4600 − 600 = 4000 db.","A PDF lehetséges következményként sorban állást, utalványrendszert és korrupciót említ."],"conclusion":"A kötő ármaximum az egyensúlyi ár alatt hiányt hoz létre.","visual":"marketlive","notes":"A hatóság legfeljebb 80 Ft-os árat engedélyez. Mi történik a fenti piacon?","id":39},{"t":"Az ár négy gazdasági szerepe","kind":"concept","chapter":3,"lead":"Az ár több, mint szám egy címkén.","points":["Információ: jelzi a viszonylagos szűkösséget és keresletet.","Ösztönzés: befolyásolja a fogyasztást és a termelést.","Elszámolás: pénzben mérhetővé teszi a ráfordításokat és eredményeket.","Elosztás és egyensúly: befolyásolja, ki mennyit vásárol és kínál."],"example":"Egy magas ár visszafoghatja a fogyasztást, ugyanakkor újabb kínálatot ösztönözhet.","key":"Az ár egyszerre jelzés, koordinátor és számítási eszköz.","visual":null,"notes":"Az ár több, mint szám egy címkén. Egy magas ár visszafoghatja a fogyasztást, ugyanakkor újabb kínálatot ösztönözhet.","formula":"","id":40},{"t":"Fogyasztó és termelő: két nézőpont","kind":"blocks","chapter":3,"blocks":[["Fogyasztó","A termék várható hasznosságát veti össze az árral.","Vajon ennyit megér nekem?"],["Termelő","Az árat a ráfordításokkal és a lehetséges nyereséggel veti össze.","Érdemes ennyiért értékesíteni?"]],"lead":"Az áralku gyakran az eltérő értékelések találkozása.","key":"Csere akkor jöhet létre, ha mindkét oldal számára elfogadható a feltétel.","notes":"Az áralku gyakran az eltérő értékelések találkozása. Csere akkor jöhet létre, ha mindkét oldal számára elfogadható a feltétel.","id":41},{"t":"Mozgás a görbén vagy a görbe eltolódása?","kind":"concept","chapter":3,"lead":"A két változás közötti különbség vizsgán kiemelten fontos.","points":["Saját ár változik → keresleti vagy kínálati görbe mentén mozgunk.","Jövedelem, ízlés, más jószág ára, termelési költség változik → a megfelelő görbe eltolódik.","A görbe eltolódása új egyensúlyi árat és mennyiséget alakíthat ki."],"example":"Ha a tej saját ára esik, a tejkereslet görbéjén mozgunk; ha nő a vevők jövedelme, a görbe eltolódhat.","key":"Az „árváltozás” és a „kereslet változása” nem ugyanaz a fogalom.","visual":"shift","notes":"A két változás közötti különbség vizsgán kiemelten fontos. Ha a tej saját ára esik, a tejkereslet görbéjén mozgunk; ha nő a vevők jövedelme, a görbe eltolódhat.","formula":"","id":42},{"t":"Kereslet- és kínálatváltozások","kind":"visual","chapter":3,"visual":"shift","lead":"Egyetlen eltolódás megváltoztathatja az egyensúlyi árat és a mennyiséget. A szimuláció a kereslet növekedését jeleníti meg.","points":["A kereslet jobbra tolódása változatlan kínálat mellett jellemzően emeli az árat és a mennyiséget.","A kínálat jobbra tolódása változatlan kereslet mellett jellemzően csökkenti az árat és emeli a mennyiséget."],"key":"Az ábrák két görbe közös rendszerében értelmezendők.","notes":"Egyetlen eltolódás megváltoztathatja az egyensúlyi árat és a mennyiséget. A szimuláció a kereslet növekedését jeleníti meg. Az ábrák két görbe közös rendszerében értelmezendők.","example":"","id":43},{"t":"Piaci ellenőrzés","kind":"quiz","chapter":3,"question":"Mi jellemző a kötő, egyensúly alatti ármaximumra?","options":["Túlkínálat keletkezik","A kereslet és kínálat automatikusan egyenlő","Túlkereslet, azaz hiány keletkezik","Mindig megszűnik a fogyasztás"],"answer":2,"why":"Az alacsonyabb ár növeli a keresett és csökkenti a kínált mennyiséget, ezért hiány alakul ki.","sub":"A Marshall-kereszt olvasása","visual":null,"id":44,"notes":"Mi jellemző a kötő, egyensúly alatti ármaximumra?"},{"t":"A piac logikája egy percben","kind":"summary","chapter":3,"lead":"","points":["A keresleti görbe általában negatív, a kínálati pozitív meredekségű.","Az egyensúly ott van, ahol D = S.","Egyensúly alatt hiány, felette többlet szokott kialakulni.","Az ár és a nem ártényezők más módon változtatják a görbéket.","A hatósági ár következményét az egyensúlyhoz viszonyítva vizsgáljuk."],"id":45,"notes":""},{"t":"Fogyasztói magatartás és hasznosság","kind":"chapter","chapter":4,"sub":"MIÉRT EZT VESSZÜ MEG?","lead":"Összhaszon, határhaszon, telítettség, Gossen törvényei és a fogyasztói optimum.","id":46,"notes":"Összhaszon, határhaszon, telítettség, Gossen törvényei és a fogyasztói optimum."},{"t":"Összhaszon (TU)","kind":"definition","chapter":4,"definition":"Egy termék adott mennyiségű fogyasztásából származó összes elégedettség.","explain":"Az összhaszon kezdetben jellemzően növekszik, ahogy újabb egységeket fogyasztunk. A növekedés üteme azonban lassulhat.","example":"Az első pohár víz nagy megkönnyebbülést jelent szomjúság esetén; az ötödik már jóval kevésbé.","key":"TU = a fogyasztott egységekhez tartozó határhasznok összege.","visual":"utility","notes":"Egy termék adott mennyiségű fogyasztásából származó összes elégedettség. Az összhaszon kezdetben jellemzően növekszik, ahogy újabb egységeket fogyasztunk. A növekedés üteme azonban lassulhat.","id":47},{"t":"Határhaszon (MU)","kind":"definition","chapter":4,"definition":"Az összhaszon változása a jószág fogyasztott mennyiségének egységnyi növelésekor.","explain":"A határhaszon nem az összes addigi elégedettség, hanem az utolsó elfogyasztott egység többlethozzájárulása.","example":"Ha az első sütemény 10, a második további 7 hasznosságegységet ad, a második MU-ja 7.","key":"MU = ΔTU / ΔQ.","visual":"utility","notes":"Az összhaszon változása a jószág fogyasztott mennyiségének egységnyi növelésekor. A határhaszon nem az összes addigi elégedettség, hanem az utolsó elfogyasztott egység többlethozzájárulása.","id":48},{"t":"A határhaszon képlete","kind":"formula","chapter":4,"formula":"MU = ΔTU / ΔQ","lead":"Olvasata: a teljes hasznosság változása osztva a fogyasztott mennyiség változásával.","points":["Δ = változás.","TU = total utility, összhaszon.","Q = mennyiség, MU = marginal utility."],"example":"Ha TU 25-ről 31-re nő, miközben Q 4-ről 5-re változik, akkor MU = (31−25)/(5−4) = 6.","key":"A „határ” az utolsó egység többlethatását jelenti.","visual":null,"notes":"Olvasata: a teljes hasznosság változása osztva a fogyasztott mennyiség változásával. Ha TU 25-ről 31-re nő, miközben Q 4-ről 5-re változik, akkor MU = (31−25)/(5−4) = 6.","id":49},{"t":"Mi történik az össz- és határhaszonnal?","kind":"visual","chapter":4,"visual":"utility","lead":"A két görbe együtt értelmezendő: az összhaszon emelkedik, de egyre lassabban, ahogy a határhaszon csökken.","points":["Pozitív MU mellett a TU nő.","MU = 0 esetén a TU lokálisan maximális, telítettségi pont.","Negatív MU esetén a további fogyasztás csökkentheti a TU-t."],"key":"Gyakorlati példa: egyre több azonos édesség fogyasztása.","notes":"A két görbe együtt értelmezendő: az összhaszon emelkedik, de egyre lassabban, ahogy a határhaszon csökken. Gyakorlati példa: egyre több azonos édesség fogyasztása.","example":"","id":50},{"t":"Telítettségi pont","kind":"definition","chapter":4,"definition":"Az a fogyasztott mennyiség, amelynél az összhaszon már nem nő tovább.","explain":"Ha valami túl soká válik, a pótlólagos egység már nem ad további előnyt. Az összhaszon csúcsa körül az utolsó egység határhaszna nulla.","example":"Az ötödik adag ételtől nem leszel elégedettebb, a hatodik már rosszul eshet.","key":"Telítettségi pont: MU = 0 az egyszerű modellben.","visual":null,"notes":"Az a fogyasztott mennyiség, amelynél az összhaszon már nem nő tovább. Ha valami túl soká válik, a pótlólagos egység már nem ad további előnyt. Az összhaszon csúcsa körül az utolsó egység határhaszna nulla.","id":51},{"t":"Gossen I. törvénye","kind":"definition","chapter":4,"definition":"A fogyasztott jószág egymást követő egységeinek határhaszna rendszerint csökken.","explain":"A további egységek még lehetnek hasznosak, de egyre kevesebbet tesznek hozzá az összhaszonhoz. Ezért a TU görbe ellaposodik.","example":"Első óra szabadidő nagyon értékes, a tizedik sorozatnézéssel eltöltött óra már kevésbé.","key":"Csökkenő határhaszon ≠ azonnal csökkenő összhaszon.","visual":"utility","notes":"A fogyasztott jószág egymást követő egységeinek határhaszna rendszerint csökken. A további egységek még lehetnek hasznosak, de egyre kevesebbet tesznek hozzá az összhaszonhoz. Ezért a TU görbe ellaposodik.","id":52},{"t":"Miért kell optimalizálnia a fogyasztónak?","kind":"concept","chapter":4,"lead":"A jövedelem korlátozott, a termékek ára eltér. Ezért a fogyasztó nem vehet meg mindent.","points":["Ha egy termékből többet vesz, kevesebb pénze marad másra.","Érdemes összevetni a nyert és a feláldozott határhasznot.","A cserét addig érdemes folytatni, amíg az összhaszon emelhető."],"example":"Ahelyett, hogy a negyedik üdítőt megvennéd, vehetsz egy szendvicset, ha több hasznot ad.","key":"Optimum: nincs olyan megfizethető kis átrendezés, ami tovább növelné a hasznot.","visual":null,"notes":"A jövedelem korlátozott, a termékek ára eltér. Ezért a fogyasztó nem vehet meg mindent. Ahelyett, hogy a negyedik üdítőt megvennéd, vehetsz egy szendvicset, ha több hasznot ad.","formula":"","id":53},{"t":"Gossen II. törvénye","kind":"formula","chapter":4,"formula":"MU₁/P₁ = MU₂/P₂ = … = MUₙ/Pₙ","lead":"A fogyasztó akkor osztja el optimálisan a pénzét belső optimum esetén, ha a különböző termékekre költött utolsó pénzegység azonos határhasznot biztosít.","points":["MU: a jószág határhaszna.","P: a jószág ára.","MU/P: egy forintra jutó határhaszon."],"example":"Ha A terméknél MU/P = 3, B-nél MU/P = 6, megérheti a költést B felé átrendezni.","key":"A pénzt ott használd fel, ahol az utolsó forint még a legtöbbet adja.","visual":null,"notes":"A fogyasztó akkor osztja el optimálisan a pénzét belső optimum esetén, ha a különböző termékekre költött utolsó pénzegység azonos határhasznot biztosít. Ha A terméknél MU/P = 3, B-nél MU/P = 6, megérheti a költést B felé átrendezni.","id":54},{"t":"Gossen II. — egyszerű döntés","kind":"worked","chapter":4,"problem":"Két termék közül választhatsz. Az egyik következő egysége 600 Ft és MU=12; a másik 400 Ft és MU=12.","steps":["A termék: MU/P = 12/600 = 0,02.","B termék: MU/P = 12/400 = 0,03.","A B termék következő egysége több hasznot ad 1 Ft-ra vetítve.","A következő egységek MU-ja változik, ezért az optimum nem egyszerűen „csak B-t venni”."],"conclusion":"A döntés az utolsó pénzegység haszna alapján indul.","visual":null,"notes":"Két termék közül választhatsz. Az egyik következő egysége 600 Ft és MU=12; a másik 400 Ft és MU=12.","id":55},{"t":"Hasznosságkvíz","kind":"quiz","chapter":4,"question":"Mikor érheti el az összhaszon a maximumát?","options":["Amikor a határhaszon nulla","Amikor a határhaszon a legnagyobb","Amikor az ár nulla","Amikor a kereslet nulla"],"answer":0,"why":"Egyszerű telítettségi modellben a TU addig növekszik, amíg az újabb egység MU-ja pozitív; MU=0-nál az összhaszon maximumhoz érhet.","sub":"Gossen I. törvénye","visual":null,"id":56,"notes":"Mikor érheti el az összhaszon a maximumát?"},{"t":"A fogyasztói döntés logikája","kind":"summary","chapter":4,"lead":"","points":["Összhaszon: a fogyasztás teljes haszna.","Határhaszon: még egy egység fogyasztásának többlethaszna.","Gossen I.: a pótlólagos egységek határhaszna csökken.","Gossen II.: belső optimumban az utolsó forintok haszna kiegyenlítődik.","A fogyasztó a jövedelemkorlát miatt mindig választás elé kerül."],"id":57,"notes":""},{"t":"Preferenciák és fogyasztói optimum","kind":"chapter","chapter":5,"sub":"JÓSZÁGKOSARAK ÉS KORLÁTOK","lead":"Közömbösségi görbék, MRS, költségvetési egyenes, változó árak és jövedelmek, optimum.","id":58,"notes":"Közömbösségi görbék, MRS, költségvetési egyenes, változó árak és jövedelmek, optimum."},{"t":"Jószágkosár","kind":"definition","chapter":5,"definition":"Két vagy több jószág meghatározott mennyiségű kombinációja.","explain":"Az elemzés nem egyetlen termék értékelésével foglalkozik, hanem azzal, hogyan hasonlítjuk össze a különböző kombinációkat.","example":"A kosár: 4 szendvics + 2 üdítő; B kosár: 2 szendvics + 5 üdítő.","key":"A preferencia azt mutatja meg, melyik kosarat értékeljük többre.","visual":null,"notes":"Két vagy több jószág meghatározott mennyiségű kombinációja. Az elemzés nem egyetlen termék értékelésével foglalkozik, hanem azzal, hogyan hasonlítjuk össze a különböző kombinációkat.","id":59},{"t":"Közömbösségi görbe","kind":"definition","chapter":5,"definition":"Azoknak a jószágkosaraknak a halmaza, amelyek a fogyasztó számára azonos hasznosságot jelentenek.","explain":"A görbe mentén egyik termékből többet, a másikból kevesebbet fogyasztunk, miközben ugyanazon hasznossági szinten maradunk.","example":"Ha 3 könyv + 4 mozijegy ugyanolyan jó, mint 2 könyv + 6 mozijegy, azonos görbén lehetnek.","key":"A görbe nem költségvetési korlátot, hanem ízlést ír le.","visual":"indifference","notes":"Azoknak a jószágkosaraknak a halmaza, amelyek a fogyasztó számára azonos hasznosságot jelentenek. A görbe mentén egyik termékből többet, a másikból kevesebbet fogyasztunk, miközben ugyanazon hasznossági szinten maradunk.","id":60},{"t":"A közömbösségi térkép","kind":"visual","chapter":5,"visual":"indifference","lead":"Több görbe különböző hasznossági szinteket ábrázol. A szokásos „több jobb” feltétellel az origótól távolabbi görbe magasabb hasznosság.","points":["Jellemzően negatív meredekségűek.","Szokásos konvex preferenciáknál az origó felé domborúak.","Az azonos hasznosságú kosarak egy görbén helyezkednek el."],"key":"A görbéknek a szabályos preferenciamodellben nem szabad metsződniük.","notes":"Több görbe különböző hasznossági szinteket ábrázol. A szokásos „több jobb” feltétellel az origótól távolabbi görbe magasabb hasznosság. A görbéknek a szabályos preferenciamodellben nem szabad metsződniük.","example":"","id":61},{"t":"A jól viselkedő preferenciák négy elve","kind":"blocks","chapter":5,"blocks":[["Monotonitás","A több jószágot nem értékeljük kevesebbre a szokásos modellben.","„Több jobb.”"],["Reflexivitás","Egy kosár legalább olyan jó, mint saját maga.","A ≥ A."],["Tranzitivitás","Ha A jobb B-nél, B pedig jobb C-nél, akkor A jobb C-nél.","A > B > C."],["Konvexitás","A kiegyensúlyozott kombinációkat sokszor előnyben részesítjük a szélsőségesekkel szemben.","A közömbösségi görbék jellemzően konvexek."]],"lead":"","key":"Ezek a feltevések teszik kezelhetővé a fogyasztói optimum modelljét.","notes":"Ezek a feltevések teszik kezelhetővé a fogyasztói optimum modelljét.","id":62},{"t":"Helyettesítés határrátája (MRS)","kind":"definition","chapter":5,"definition":"Megmutatja, az X jószág egy további egységéért mennyi Y jószágról hajlandó lemondani a fogyasztó változatlan hasznosság mellett.","explain":"A helyettesítési arány a görbe mentén változhat. Konvex közömbösségi görbén az X mennyiségének növelésével az X újabb egységéért rendszerint egyre kevesebb Y-t adnánk fel.","example":"Ha +2 X-ért −4 Y-ról mondunk le, a helyettesítés határrátája 2.","key":"MRS = −ΔY/ΔX a közömbösségi görbe mentén.","visual":"indifference","notes":"Megmutatja, az X jószág egy további egységéért mennyi Y jószágról hajlandó lemondani a fogyasztó változatlan hasznosság mellett. A helyettesítési arány a görbe mentén változhat. Konvex közömbösségi görbén az X mennyiségének növelésével az X újabb egységéért rendszerint egyre kevesebb Y-t adnánk fel.","id":63},{"t":"MRS: számoljuk ki pontosan","kind":"formula","chapter":5,"formula":"MRS = −ΔY / ΔX = MUₓ / MUᵧ","lead":"Az X növelésekor Y csökken, ezért a görbe meredeksége negatív; a szokásos pozitív MRS a meredekség ellentettje.","points":["ΔY negatív, ha Y-ból lemondunk.","Az MRS általában pozitív nagyságként szerepel.","A határhasznok aránya: MUx/MUy."],"example":"X: 2 → 4, Y: 14 → 10. MRS = −(−4)/2 = 2.","key":"Az X és Y változásainak megfelelő előjelet használj.","visual":null,"notes":"Az X növelésekor Y csökken, ezért a görbe meredeksége negatív; a szokásos pozitív MRS a meredekség ellentettje. X: 2 → 4, Y: 14 → 10. MRS = −(−4)/2 = 2.","id":64},{"t":"MRS-gyakorló táblázat","kind":"worked","chapter":5,"problem":"A megoldásos PDF közömbösnek tekintett kosarai: (2;14), (4;10), (7;8), (9;7), (12;6).","steps":["2→4 X és 14→10 Y: MRS = −(−4)/2 = 2.","4→7 X és 10→8 Y: MRS = −(−2)/3 = 2/3.","7→9 X és 8→7 Y: MRS = −(−1)/2 = 0,5.","9→12 X és 7→6 Y: MRS = −(−1)/3 = 1/3."],"conclusion":"Az MRS csökken: 2 → ⅔ → ½ → ⅓.","visual":"indifference","notes":"A megoldásos PDF közömbösnek tekintett kosarai: (2;14), (4;10), (7;8), (9;7), (12;6).","id":65},{"t":"Költségvetési halmaz","kind":"definition","chapter":5,"definition":"Az összes olyan jószágkosár, amelyet a fogyasztó az adott jövedelméből és árak mellett megfizethet.","explain":"A fogyasztó nem csak a pénzt teljesen felhasználó kosarakat választhatja, hanem azokat is, amelyek kevesebbe kerülnek. Ezt különböztetjük meg a költségvetési egyenestől.","example":"20 000 Ft jövedelem mellett egy 15 000 Ft-os kosár elérhető, egy 25 000 Ft-os nem.","key":"Halmaz: az egyenesen és az alatta fekvő megfizethető kombinációk.","visual":"budget","notes":"Az összes olyan jószágkosár, amelyet a fogyasztó az adott jövedelméből és árak mellett megfizethet. A fogyasztó nem csak a pénzt teljesen felhasználó kosarakat választhatja, hanem azokat is, amelyek kevesebbe kerülnek. Ezt különböztetjük meg a költségvetési egyenestől.","id":66},{"t":"Költségvetési egyenes","kind":"definition","chapter":5,"definition":"Azoknak a kétjószágos kombinációknak a halmaza, amelyek a teljes fogyasztási keretet pontosan kimerítik.","explain":"Ha az egyik termékből többet veszünk, a másikra kevesebb marad. Az egyenes a pénzbeni átváltást mutatja.","example":"20 000 Ft-ból 500 Ft-os X és 400 Ft-os Y jószágot vehetünk; különböző párok ugyanannyiba kerülnek.","key":"PₓX + PᵧY = I.","visual":"budget","notes":"Azoknak a kétjószágos kombinációknak a halmaza, amelyek a teljes fogyasztási keretet pontosan kimerítik. Ha az egyik termékből többet veszünk, a másikra kevesebb marad. Az egyenes a pénzbeni átváltást mutatja.","id":67},{"t":"A költségvetési egyenes egyenlete","kind":"formula","chapter":5,"formula":"Pₓ·X + Pᵧ·Y = I","lead":"A két termékre költött pénz összege megegyezik a rendelkezésre álló jövedelemmel.","points":["I: jövedelem vagy fogyasztásra szánt keret.","Px, Py: egységárak.","X, Y: vásárolt mennyiségek."],"example":"I = 20 000, Px = 500 és Py = 400 esetén 500X + 400Y = 20 000.","key":"A tengelymetszetek: Xmax = I/Px; Ymax = I/Py.","visual":"budget","notes":"A két termékre költött pénz összege megegyezik a rendelkezésre álló jövedelemmel. I = 20 000, Px = 500 és Py = 400 esetén 500X + 400Y = 20 000.","id":68},{"t":"Költségvetési egyenes: tengelymetszet","kind":"worked","chapter":5,"problem":"I = 20 000 Ft, Px = 500 Ft, Py = 400 Ft. Mennyit vehetünk kizárólag X-ből vagy kizárólag Y-ból?","steps":["Ha Y=0, akkor X = 20 000/500 = 40 egység.","Ha X=0, akkor Y = 20 000/400 = 50 egység.","Az egyenes a (40;0) és (0;50) pontokon megy át.","Meredeksége: −Px/Py = −500/400 = −1,25."],"conclusion":"A vásárlási keret ugyanaz; a kombináció változhat.","visual":"budget","notes":"I = 20 000 Ft, Px = 500 Ft, Py = 400 Ft. Mennyit vehetünk kizárólag X-ből vagy kizárólag Y-ból?","id":69},{"t":"Interaktív költségvetési egyenes","kind":"visual","chapter":5,"visual":"budgetlive","lead":"Állítsd a jövedelmet és a két termék árát. A tengelymetszetek és a meredekség azonnal frissülnek.","points":["Jövedelemnövekedés, állandó árak: párhuzamos kifelé tolódás.","Egyetlen termék árának növekedése: az egyenes elfordul.","A tengelymetszetek jelzik a maximálisan megvehető mennyiségeket."],"key":"Az alapadatok a számítási PDF-ből származnak.","notes":"Állítsd a jövedelmet és a két termék árát. A tengelymetszetek és a meredekség azonnal frissülnek. Az alapadatok a számítási PDF-ből származnak.","example":"","id":70},{"t":"Mi történik, ha Y ára megduplázódik?","kind":"worked","chapter":5,"problem":"Marad I=20 000 és Px=500, de Py 400-ról 800 Ft-ra emelkedik.","steps":["X maximuma nem változik: 20 000/500 = 40.","Y maximuma 20 000/800 = 25-re csökken.","Az Y-tengely metszete közelebb kerül az origóhoz.","Az egyenes meredeksége −500/800 = −0,625; laposabb."],"conclusion":"Egy ár változása elfordítja a költségvetési egyenest.","visual":"budget","notes":"Marad I=20 000 és Px=500, de Py 400-ról 800 Ft-ra emelkedik.","id":71},{"t":"Mi történik, ha X ára megduplázódik?","kind":"worked","chapter":5,"problem":"Marad I=20 000 és Py=400, de Px 500-ról 1000 Ft-ra emelkedik.","steps":["X maximuma 20 000/1000 = 20-ra csökken.","Y maximuma változatlan: 20 000/400 = 50.","Az X-tengely metszete közelebb kerül az origóhoz.","Meredekség: −1000/400 = −2,5; az egyenes meredekebb."],"conclusion":"Árarány-változáskor a költségvetési egyenes elfordul.","visual":"budget","notes":"Marad I=20 000 és Py=400, de Px 500-ról 1000 Ft-ra emelkedik.","id":72},{"t":"A fogyasztó optimális jószágkosara","kind":"concept","chapter":5,"lead":"A fogyasztó a költségvetése mellett elérhető legmagasabb hasznossági szintre törekszik.","points":["Ábrán: a költségvetési egyenes az elérhető legmagasabb közömbösségi görbét érinti.","Belső, sima optimum esetén a két görbe meredeksége azonos.","A fogyasztó nem tud megfizethető átrendezéssel nagyobb haszonhoz jutni."],"example":"A költségvetés megmondja, mit engedhetsz meg; a preferencia, mit szeretnél.","key":"Optimum = vágyak és lehetőségek találkozása.","visual":"optimum","notes":"A fogyasztó a költségvetése mellett elérhető legmagasabb hasznossági szintre törekszik. A költségvetés megmondja, mit engedhetsz meg; a preferencia, mit szeretnél.","formula":"","id":73},{"t":"Az optimum érintési feltétele","kind":"formula","chapter":5,"formula":"MRS = Pₓ/Pᵧ = MUₓ/MUᵧ","lead":"Belső optimum esetén a fogyasztó szubjektív helyettesítési aránya megegyezik a piac által meghatározott árarányokkal.","points":["A bal oldal a fogyasztói preferenciát fejezi ki.","A középső tag a piaci cserearányt mutatja.","A jobb oldal a két termék határhasznainak aránya."],"example":"Ha Px/Py = 2, belső optimumon a fogyasztó 1 extra X-ért 2 Y-t áldozna.","key":"Ez a feltétel belső optimumra vonatkozik; sarokmegoldásnál nem feltétlenül teljesül.","visual":"optimum","notes":"Belső optimum esetén a fogyasztó szubjektív helyettesítési aránya megegyezik a piac által meghatározott árarányokkal. Ha Px/Py = 2, belső optimumon a fogyasztó 1 extra X-ért 2 Y-t áldozna.","id":74},{"t":"Jövedelem–fogyasztás görbe (ICC)","kind":"definition","chapter":5,"definition":"A változó jövedelem mellett adódó optimális fogyasztói kosarakat összekötő görbe változatlan árak esetén.","explain":"Az összekötött érintési pontok azt mutatják, hogyan változik a választott X–Y kombináció, ha csak a jövedelem változik.","example":"Magasabb jövedelemből többféle megfizethető kosár közül választhatsz.","key":"A költségvetési egyenesek párhuzamosan tolódnak.","visual":null,"notes":"A változó jövedelem mellett adódó optimális fogyasztói kosarakat összekötő görbe változatlan árak esetén. Az összekötött érintési pontok azt mutatják, hogyan változik a választott X–Y kombináció, ha csak a jövedelem változik.","id":75},{"t":"Engel-görbe","kind":"definition","chapter":5,"definition":"Az egyik jószágból keresett mennyiség és a fogyasztó jövedelme közötti kapcsolatot mutatja.","explain":"A PDF együtt tárgyalja az ICC-görbét és az Engel-görbét: az ICC a kéttermékes kosárban mutatja az optimumokat, az Engel-görbe egy termék mennyiségét állítja szembe a jövedelemmel.","example":"Ha nő a jövedelem, változhat a prémium termékek keresett mennyisége.","key":"Az Engel-görbe a jövedelemtől függő fogyasztást szemlélteti.","visual":null,"notes":"Az egyik jószágból keresett mennyiség és a fogyasztó jövedelme közötti kapcsolatot mutatja. A PDF együtt tárgyalja az ICC-görbét és az Engel-görbét: az ICC a kéttermékes kosárban mutatja az optimumokat, az Engel-görbe egy termék mennyiségét állítja szembe a jövedelemmel.","id":76},{"t":"Az egyéni keresleti görbe levezetése","kind":"concept","chapter":5,"lead":"Állandó pénzjövedelem mellett az egyik termék árát változtatjuk.","points":["Az árváltozás elfordítja a költségvetési egyenest.","Változnak a közömbösségi görbével alkotott érintési pontok.","A különböző ár–optimális mennyiség párokból levezethető az egyéni keresleti görbe."],"example":"Ha X olcsóbb lesz, ugyanabból a keretből több X engedhető meg.","key":"PCC: ár–fogyasztás görbe; a PDF az Engel/ICC mellett ezt is ábrázolja.","visual":null,"notes":"Állandó pénzjövedelem mellett az egyik termék árát változtatjuk. Ha X olcsóbb lesz, ugyanabból a keretből több X engedhető meg.","formula":"","id":77},{"t":"Preferenciák és optimum","kind":"quiz","chapter":5,"question":"Mi a belső fogyasztói optimum érintési feltétele?","options":["MRS = Px/Py","MRS = Px+Py","Px = Py minden helyzetben","MUx = MUy minden helyzetben"],"answer":0,"why":"Az MRS = MUx/MUy aránynak kell megegyeznie a két ár hányadosával, ha a választás belső optimum.","sub":"Fontos képlet","visual":null,"id":78,"notes":"Mi a belső fogyasztói optimum érintési feltétele?"},{"t":"Egyetlen ábra mögött három fogalom","kind":"summary","chapter":5,"lead":"","points":["Közömbösségi görbe: ugyanaz a hasznosság különböző kosarakban.","Költségvetési egyenes: a teljes keretből megfizethető kombinációk határa.","MRS: szubjektív helyettesítési arány.","Belső optimum: MRS = Px/Py.","Jövedelemváltozás párhuzamosan, árváltozás forgással mozgatja a korlátot."],"id":79,"notes":""},{"t":"Kereslet és rugalmasság","kind":"chapter","chapter":6,"sub":"MENNYIRE ÉRZÉKENY A VEVŐ?","lead":"Árhatások, helyettesítők, árrugalmasság, kereszt- és jövedelemrugalmasság.","id":80,"notes":"Árhatások, helyettesítők, árrugalmasság, kereszt- és jövedelemrugalmasság."},{"t":"Az árváltozás két hatása","kind":"blocks","chapter":6,"blocks":[["Helyettesítési hatás","Megváltoznak a relatív árak; a viszonylag olcsóbb jószág felé fordulhatunk.","Sertéshús helyett csirkehúst választunk, ha a csirke relatíve olcsóbb."],["Jövedelmi hatás","Az ár változása módosítja az adott pénzből megvásárolható jószágmennyiséget.","Egy termék olcsóbb lett, így ugyanakkora pénzből több marad másra."]],"lead":"","key":"Az árváltozás teljes hatása e két összetevőből adódik.","notes":"Az árváltozás teljes hatása e két összetevőből adódik.","id":81},{"t":"A keresletet befolyásoló tényezők","kind":"concept","chapter":6,"lead":"Nem csak a saját ár számít a vásárlói döntésben.","points":["A vizsgált jószág saját ára.","Más, helyettesítő vagy kiegészítő jószágok árai.","A fogyasztók jövedelme.","Preferenciák, várakozások és más nem ártényezők (kiegészítő magyarázat)."],"example":"A kávé ára mellett számíthat a tea ára és a vevő jövedelme is.","key":"A rugalmasság a változások mértékét méri.","visual":null,"notes":"Nem csak a saját ár számít a vásárlói döntésben. A kávé ára mellett számíthat a tea ára és a vevő jövedelme is.","formula":"","id":82},{"t":"Kereslet árrugalmassága (ε)","kind":"definition","chapter":6,"definition":"Megmutatja, hány százalékkal változik a keresett mennyiség a termék árának 1%-os változására.","explain":"Az ár és a keresett mennyiség általában ellentétesen mozog, ezért a rugalmasság előjele gyakran negatív. A PDF az abszolút értékét használja a kategorizáláshoz.","example":"Ha az ár 10%-kal nő és a keresett mennyiség 20%-kal csökken, |ε|=2.","key":"|ε| = |(ΔQ/Q)/(ΔP/P)|.","visual":"elasticity","notes":"Megmutatja, hány százalékkal változik a keresett mennyiség a termék árának 1%-os változására. Az ár és a keresett mennyiség általában ellentétesen mozog, ezért a rugalmasság előjele gyakran negatív. A PDF az abszolút értékét használja a kategorizáláshoz.","id":83},{"t":"A rugalmasság alapkifejezése","kind":"formula","chapter":6,"formula":"ε = (ΔQ / Q₀) / (ΔP / P₀)","lead":"A százalékos mennyiségváltozást osztjuk a százalékos árváltozással, azonos bázist használva.","points":["ΔQ: a keresett mennyiség változása.","Q₀: kiinduló mennyiség.","ΔP: árváltozás.","P₀: kiinduló ár."],"example":"P: 100→110 (10%), Q: 200→170 (−15%): ε=−1,5, azaz |ε|=1,5.","key":"Nagyobb, mint 1: rugalmas kereslet.","visual":null,"notes":"A százalékos mennyiségváltozást osztjuk a százalékos árváltozással, azonos bázist használva. P: 100→110 (10%), Q: 200→170 (−15%): ε=−1,5, azaz |ε|=1,5.","id":84},{"t":"Három rugalmassági kategória","kind":"blocks","chapter":6,"blocks":[["|ε| > 1","Rugalmas kereslet","A mennyiség %-os változása nagyobb az ár %-os változásánál."],["|ε| = 1","Egységnyi rugalmasság","A két százalékos változás abszolút értéke azonos."],["|ε| < 1","Rugalmatlan kereslet","A mennyiség relatíve kevésbé reagál az árra."]],"lead":"","key":"Rugalmasságot százalékokkal számolunk, nem forint/db különbségekkel.","notes":"Rugalmasságot százalékokkal számolunk, nem forint/db különbségekkel.","id":85},{"t":"A kereslet lehet laposabb vagy meredekebb","kind":"visual","chapter":6,"visual":"elasticity","lead":"Az ábra két eltérő árérzékenységi helyzetet szemléltet. A meredekség és a rugalmasság nem minden esetben azonos fogalom, de szemléltetésként segítik a megértést.","points":["Sok közeli helyettesítő → rendszerint rugalmasabb kereslet.","Nagy jövedelemhányad → rendszerint érzékenyebb fogyasztói reakció.","Hosszabb idő → több alkalmazkodási lehetőség."],"key":"Rövid távon a fogyasztó nehezebben vált; hosszabb távon könnyebben módosíthat szokásokat.","notes":"Az ábra két eltérő árérzékenységi helyzetet szemléltet. A meredekség és a rugalmasság nem minden esetben azonos fogalom, de szemléltetésként segítik a megértést. Rövid távon a fogyasztó nehezebben vált; hosszabb távon könnyebben módosíthat szokásokat.","example":"","id":86},{"t":"Teljes bevétel","kind":"formula","chapter":6,"formula":"TR = P × Q","lead":"A termék árát a ténylegesen eladott mennyiséggel szorozzuk. Az árrugalmasság befolyásolja, hogy egy árváltozás merre mozdítja el a bevételt.","points":["Rugalmas szakaszon áremelés → TR csökkenhet.","Rugalmatlan szakaszon áremelés → TR nőhet.","Egységnyi rugalmasságnál kis változás esetén a TR körülbelül változatlan."],"example":"100 db × 700 Ft = 70 000 Ft; 200 db × 350 Ft = ugyanúgy 70 000 Ft.","key":"Az ár és az eladott mennyiség egyszerre változhat.","visual":"revenue","notes":"A termék árát a ténylegesen eladott mennyiséggel szorozzuk. Az árrugalmasság befolyásolja, hogy egy árváltozás merre mozdítja el a bevételt. 100 db × 700 Ft = 70 000 Ft; 200 db × 350 Ft = ugyanúgy 70 000 Ft.","id":87},{"t":"Ár, rugalmasság és árbevétel","kind":"blocks","chapter":6,"blocks":[["Rugalmas","Ha az ár nő, a bevétel csökkenhet; ha az ár csökken, nőhet.","|ε| > 1"],["Rugalmatlan","Ha az ár nő, a bevétel nőhet; ha csökken, eshet.","|ε| < 1"],["Egységnyi","Kis változás mellett az ár és mennyiség hatása kioltja egymást.","|ε| = 1"]],"lead":"","key":"A fenti szabályok helyi változásokra vagy megfelelően értelmezett rugalmassági szakaszokra vonatkoznak.","notes":"A fenti szabályok helyi változásokra vagy megfelelően értelmezett rugalmassági szakaszokra vonatkoznak.","id":88},{"t":"Kereszt-árrugalmasság","kind":"definition","chapter":6,"definition":"Azt méri, egy jószág kereslete hány százalékkal változik egy másik jószág árának 1%-os változására.","explain":"Pozitív érték helyettesítő kapcsolatot, negatív érték kiegészítő kapcsolatot jelezhet.","example":"Vaj és margarin: helyettesítők. Autó és üzemanyag: egymást kiegészítők.","key":"εxy = (%ΔQx)/(%ΔPy).","visual":null,"notes":"Azt méri, egy jószág kereslete hány százalékkal változik egy másik jószág árának 1%-os változására. Pozitív érték helyettesítő kapcsolatot, negatív érték kiegészítő kapcsolatot jelezhet.","id":89},{"t":"Helyettesítő vagy kiegészítő?","kind":"blocks","chapter":6,"blocks":[["Helyettesítő javak","Egyik drágulásakor a másik iránti kereslet nőhet.","Pozitív kereszt-árrugalmasság."],["Kiegészítő javak","Egyik drágulásakor a másik iránti kereslet csökkenhet.","Negatív kereszt-árrugalmasság."]],"lead":"","key":"A kereszt-árrugalmasság előjeléből olvasunk kapcsolatot.","notes":"A kereszt-árrugalmasság előjeléből olvasunk kapcsolatot.","id":90},{"t":"Kereslet jövedelemrugalmassága","kind":"definition","chapter":6,"definition":"Azt mutatja, egy jószág kereslete hány százalékkal változik a fogyasztó jövedelmének 1%-os változására.","explain":"Pozitív érték esetén a termék normál jószág. Negatív érték alsóbbrendű jószágot jelez a vizsgált jövedelemtartományban.","example":"Jövedelemnövekedéssel a prémium szolgáltatások iránti kereslet gyorsabban emelkedhet.","key":"εI = (%ΔQ)/(%ΔI).","visual":null,"notes":"Azt mutatja, egy jószág kereslete hány százalékkal változik a fogyasztó jövedelmének 1%-os változására. Pozitív érték esetén a termék normál jószág. Negatív érték alsóbbrendű jószágot jelez a vizsgált jövedelemtartományban.","id":91},{"t":"Jószágtípusok jövedelem szerint","kind":"blocks","chapter":6,"blocks":[["Normál jószág","Jövedelem emelkedik → keresett mennyisége nő.","Jövedelemrugalmassága pozitív."],["Luxus jószág","Kereslete a jövedelemnél általában gyorsabban bővül.","Jellemzően εI > 1 (kiegészítő pontosítás)."],["Alsóbbrendű jószág","Jövedelem emelkedik → a fogyasztó kevesebbet vesz belőle.","Jövedelemrugalmassága negatív."]],"lead":"","key":"Ugyanaz a termék különböző fogyasztók és jövedelemszintek esetén más besorolást kaphat.","notes":"Ugyanaz a termék különböző fogyasztók és jövedelemszintek esetén más besorolást kaphat.","id":92},{"t":"Paradox árhatások","kind":"concept","chapter":6,"lead":"Vannak speciális esetek, amikor az ár és a keresett mennyiség nem a megszokott, ellentétes irányban változik.","points":["Presztízs- vagy sznobhatás: a magas ár státuszjelzés lehet.","Spekuláció: várható további drágulás vásárlási hullámot válthat ki.","Giffen-hatás: bizonyos erősen alsóbbrendű, alapvető javaknál az áremelés növelheti a keresett mennyiséget."],"example":"Ezek kivételek, nem a normál keresleti görbe általános jellemzői.","key":"A negatív meredekség szabálya mögött speciális feltételek vannak.","visual":null,"notes":"Vannak speciális esetek, amikor az ár és a keresett mennyiség nem a megszokott, ellentétes irányban változik. Ezek kivételek, nem a normál keresleti görbe általános jellemzői.","formula":"","id":93},{"t":"Árrugalmasság: biztos fogalom?","kind":"quiz","chapter":6,"question":"Ha 10%-os áremelkedésre 25%-kal csökken a keresett mennyiség, milyen a kereslet?","options":["Rugalmatlan","Rugalmas","Egységnyi","Nem számítható"],"answer":1,"why":"Az abszolút rugalmasság: 25/10 = 2,5 > 1; a kereslet rugalmas.","sub":"Képletértelmezés","visual":null,"id":94,"notes":"Ha 10%-os áremelkedésre 25%-kal csökken a keresett mennyiség, milyen a kereslet?"},{"t":"A kereslet rugalmasságának lényege","kind":"summary","chapter":6,"lead":"","points":["Sajátár-rugalmasság: ár és ugyanazon termék keresett mennyisége.","Kereszt-árrugalmasság: másik termék ára és a vizsgált termék kereslete.","Jövedelemrugalmasság: jövedelem és kereslet.","|ε|>1 rugalmas; |ε|<1 rugalmatlan; |ε|=1 egységnyi.","A teljes bevételhez mindig a P×Q összefüggést használd."],"id":95,"notes":""},{"t":"Vállalat, termelés és technológia","kind":"chapter","chapter":7,"sub":"HOGYAN LESZ INPUTBÓL OUTPUT?","lead":"Vállalati formák, termelési függvény, határtermék, helyettesítés és szervezeti döntések.","id":96,"notes":"Vállalati formák, termelési függvény, határtermék, helyettesítés és szervezeti döntések."},{"t":"Vállalat","kind":"definition","chapter":7,"definition":"A termelés megszervezésére létrehozott, összehangoltan működő gazdasági szervezet.","explain":"A vállalat erőforrásokat egyesít és javakat vagy szolgáltatásokat állít elő. A tananyag meghatározó céljaként a profitszerzést emeli ki, de stratégiai céljai között szerepelhet növekedés, innováció és piaci részesedés is.","example":"Egy disztribúciós központ munkát, tőkét, információt és infrastruktúrát szervez a kereskedelmi szolgáltatás támogatására.","key":"Input → termelési folyamat → output.","visual":null,"notes":"A termelés megszervezésére létrehozott, összehangoltan működő gazdasági szervezet. A vállalat erőforrásokat egyesít és javakat vagy szolgáltatásokat állít elő. A tananyag meghatározó céljaként a profitszerzést emeli ki, de stratégiai céljai között szerepelhet növekedés, innováció és piaci részesedés is.","id":97},{"t":"A termelés alapvető inputjai","kind":"blocks","chapter":7,"blocks":[["Munka (L)","Munkaidő, emberi erőfeszítés és készség.","L: labour."],["Tőke (K)","Termelőeszközök, berendezések, infrastruktúra.","K: capital."],["Föld (T)","Természeti erőforrások, terület.","T: terrain a PDF jelölésében."],["Nyersanyagok","Felhasznált anyagok és készletek.","A kibocsátás részei vagy feltételei."]],"lead":"","key":"A termelés a különböző inputok kombinációjával zajlik.","notes":"A termelés a különböző inputok kombinációjával zajlik.","id":98},{"t":"Termelési függvény","kind":"definition","chapter":7,"definition":"Adott technológia mellett különböző inputkombinációkból maximálisan előállítható kibocsátást megmutató kapcsolat.","explain":"Ez technológiai összefüggés: nem közvetlenül az árakról, hanem a fizikai lehetőségekről szól. A hatékonyság a felhasznált erőforrások és az output viszonyában látszik.","example":"Ugyanannyi munkaórából korszerűbb komissiózó rendszerrel több rendelés teljesíthető.","key":"Q = f(L,K,…) — modelljelölés a témához.","visual":"production","notes":"Adott technológia mellett különböző inputkombinációkból maximálisan előállítható kibocsátást megmutató kapcsolat. Ez technológiai összefüggés: nem közvetlenül az árakról, hanem a fizikai lehetőségekről szól. A hatékonyság a felhasznált erőforrások és az output viszonyában látszik.","id":99},{"t":"Termelés és a csökkenő határtermék","kind":"visual","chapter":7,"visual":"production","lead":"Rögzített géppark mellett kezdetben sokat segíthet minden új dolgozó, majd az extra létszám hozadéka csökkenhet.","points":["Kevesebb dolgozónál nagy lehet az együttműködési előny.","Később a korlátozott gépkapacitás és helyszűke fékezi a növekedést.","A termelés még nőhet, miközben a határtermék már csökken."],"key":"A termelési hatékonyság vizsgálata segít az optimális létszám meghatározásában.","notes":"Rögzített géppark mellett kezdetben sokat segíthet minden új dolgozó, majd az extra létszám hozadéka csökkenhet. A termelési hatékonyság vizsgálata segít az optimális létszám meghatározásában.","example":"","id":100},{"t":"Határtermék (MP)","kind":"definition","chapter":7,"definition":"Az output változása valamely input egységnyi mennyiségnövelésekor, más inputok változatlansága mellett.","explain":"Azt mondja meg, hogy a következő egység erőforrás mekkora pótlólagos kibocsátást eredményez.","example":"Ha 8 dolgozó napi 800 dobozt, 9 dolgozó 890 dobozt készít, a kilencedik dolgozó határterméke 90 doboz.","key":"MP = ΔQ/ΔL (munka esetén).","visual":"production","notes":"Az output változása valamely input egységnyi mennyiségnövelésekor, más inputok változatlansága mellett. Azt mondja meg, hogy a következő egység erőforrás mekkora pótlólagos kibocsátást eredményez.","id":101},{"t":"A munka határterméke","kind":"formula","chapter":7,"formula":"MPᴸ = ΔQ / ΔL","lead":"Többletkibocsátás osztva a bevont munka mennyiségének növekményével.","points":["Q: kibocsátás.","L: munkaráfordítás / munkaerő.","Δ: két helyzet közötti különbség."],"example":"A termelés 1000-ről 1120-ra nő, a létszám 10-ről 12-re: MPL = 120/2 = 60 termék/fő.","key":"Ez fizikai határtermék, nem pénzben mért jövedelem.","visual":null,"notes":"Többletkibocsátás osztva a bevont munka mennyiségének növekményével. A termelés 1000-ről 1120-ra nő, a létszám 10-ről 12-re: MPL = 120/2 = 60 termék/fő.","id":102},{"t":"Technológiai helyettesítés határrátája (TRS)","kind":"definition","chapter":7,"definition":"Az az inputhelyettesítési arány, amely mellett változatlan kibocsátás tartható fenn.","explain":"A vállalat például gépesítés révén csökkentheti a szükséges munkaórát, miközben ugyanannyi terméket állít elő. Az ilyen kombinációk az egyenlőtermék-görbén helyezkednek el.","example":"Egy gyorsabb szortírozógép révén ugyanazt a mennyiséget kevesebb manuális munkaórával lehet teljesíteni.","key":"TRS: termelési oldal; MRS: fogyasztói oldal.","visual":null,"notes":"Az az inputhelyettesítési arány, amely mellett változatlan kibocsátás tartható fenn. A vállalat például gépesítés révén csökkentheti a szükséges munkaórát, miközben ugyanannyi terméket állít elő. Az ilyen kombinációk az egyenlőtermék-görbén helyezkednek el.","id":103},{"t":"Csökkenő határtermék törvénye","kind":"concept","chapter":7,"lead":"Más inputok és a technológia változatlansága mellett egy input folyamatos növelése után pótlólagos hozama csökkenhet.","points":["Nem a teljes output azonnali csökkenését jelenti.","A fix erőforrás korláttá válhat.","A határtermék és az átlagtermék külön fogalmak."],"example":"A létszám növelése közben a raktári folyosók zsúfolttá válnak: az új dolgozó már kevesebbet tesz hozzá a teljesítményhez.","key":"A következő dolgozó értékét a hozamával és bérköltségével együtt vizsgáljuk.","visual":"production","notes":"Más inputok és a technológia változatlansága mellett egy input folyamatos növelése után pótlólagos hozama csökkenhet. A létszám növelése közben a raktári folyosók zsúfolttá válnak: az új dolgozó már kevesebbet tesz hozzá a teljesítményhez.","formula":"","id":104},{"t":"Munkaerő-felvétel egyensúlya","kind":"formula","chapter":7,"formula":"P × MPᴸ = W  ⇔  MPᴸ = W/P","lead":"A PDF a versenyző vállalat munkaerő-optimumát a munka határtermékének és a reálbérnek az egyenlőségével mutatja be.","points":["P: kibocsátás egységára.","MPL: a munka fizikai határterméke.","W: nominális munkabér; W/P: reálbér."],"example":"Ha egy új munkaóra 10 terméket állít elő 500 Ft-os áron, a határtermék értéke 5000 Ft.","key":"Az itt szereplő feltétel egyszerűsített, versenyző modellhez tartozik.","visual":null,"notes":"A PDF a versenyző vállalat munkaerő-optimumát a munka határtermékének és a reálbérnek az egyenlőségével mutatja be. Ha egy új munkaóra 10 terméket állít elő 500 Ft-os áron, a határtermék értéke 5000 Ft.","id":105},{"t":"Vállalati formák a tananyagban","kind":"blocks","chapter":7,"blocks":[["Tevékenység","Termelő, forgalmazó vagy szolgáltató.","Mit állít elő?"],["Tulajdon","Állami, önkormányzati, magán, szövetkezeti.","Kié a szervezet?"],["Jogi forma","Egyéni vállalkozás, személyegyesülés, gazdasági társaság, részvénytársaság.","Hogyan szervezett a tulajdon és felelősség?"]],"lead":"","key":"A jogi felelősség és a tulajdonosi kontroll alapvetően különbözhet.","notes":"A jogi felelősség és a tulajdonosi kontroll alapvetően különbözhet.","id":106},{"t":"Tulajdonos, társaság, részvénytársaság","kind":"blocks","chapter":7,"blocks":[["Tulajdonos által irányított","A tulajdonos személyesen szervezi a működést.","A PDF a kisvállalatot és a személyes felelősséget emeli ki."],["Társaság","Több személy egyesíthet vagyont és kockázatot.","Lehet korlátozott vagy korlátlan felelősség."],["Részvénytársaság","Tőkéjét részvényesek adják, a vezetés elkülönülhet.","Tulajdonosi és menedzseri érdek eltérhet."]],"lead":"","key":"A vállalati forma befolyásolja a finanszírozást és az irányítást.","notes":"A vállalati forma befolyásolja a finanszírozást és az irányítást.","id":107},{"t":"Vállalati stratégia és taktika","kind":"concept","chapter":7,"lead":"A stratégia hosszú távú célok és a hozzájuk rendelt fő eszközök együttese.","points":["Piaci részesedés vagy növekedés.","Márka és vállalati imázs.","Pénzügyi stabilitás.","Modernizálás, innováció."],"example":"A vállalat választhat automatizálást, terjeszkedést vagy magasabb szolgáltatási szintet is.","key":"A profit fontos cél, de a célrendszer több elemből állhat.","visual":null,"notes":"A stratégia hosszú távú célok és a hozzájuk rendelt fő eszközök együttese. A vállalat választhat automatizálást, terjeszkedést vagy magasabb szolgáltatási szintet is.","formula":"","id":108},{"t":"Termelési ellenőrzés","kind":"quiz","chapter":7,"question":"Mit mér a munka határterméke (MPL)?","options":["A teljes vállalati bevételt","Egy további munkaegység miatti outputváltozást","A munkabér összegét","A gépek beszerzési árát"],"answer":1,"why":"MPL=ΔQ/ΔL: az input (munka) változására jutó pótlólagos kibocsátás.","sub":"Termelési függvény","visual":null,"id":109,"notes":"Mit mér a munka határterméke (MPL)?"},{"t":"A vállalati termelés kulcsai","kind":"summary","chapter":7,"lead":"","points":["A vállalat inputokból outputot állít elő.","A termelési függvény technológiai kapcsolatot ír le.","A határtermék a következő inputegység pótlólagos hozama.","Rögzített más inputok mellett a határtermék csökkenhet.","A szervezeti forma, a stratégia és az ösztönzők befolyásolják a döntést."],"id":110,"notes":""},{"t":"Vállalati költségek","kind":"chapter","chapter":8,"sub":"MIBE KERÜL A TERMELÉS?","lead":"Explicit és implicit költségek, időtávok, teljes-, átlag- és határköltségek, üzemméret.","id":111,"notes":"Explicit és implicit költségek, időtávok, teljes-, átlag- és határköltségek, üzemméret."},{"t":"Ráfordítás és költség","kind":"definition","chapter":8,"definition":"Ráfordítás: a felhasznált termelési tényező. Költség: a ráfordítás pénzben kifejezett értéke.","explain":"Ugyanannyi fizikai anyag más piaci inputár mellett eltérő költséget jelent. A vállalat döntéseit a jövőbeni, releváns költségek határozzák meg.","example":"100 kWh villamosenergia a ráfordítás; a hozzá tartozó számlázott összeg a költség.","key":"A technológia a ráfordítást, a piac az inputok árát is befolyásolja.","visual":null,"notes":"Ráfordítás: a felhasznált termelési tényező. Költség: a ráfordítás pénzben kifejezett értéke. Ugyanannyi fizikai anyag más piaci inputár mellett eltérő költséget jelent. A vállalat döntéseit a jövőbeni, releváns költségek határozzák meg.","id":112},{"t":"Explicit költség","kind":"definition","chapter":8,"definition":"A termeléshez kapcsolódó tényleges pénzkifizetés.","explain":"Ilyen a bérek, anyagok, energia vagy bérleti díj kifizetése. A vállalat pénzforgalmában általában közvetlenül megjelenik.","example":"500 000 Ft havi helyiségbérlet; 120 000 Ft energia.","key":"Explicit = látható, ténylegesen kifizetett összeg.","visual":null,"notes":"A termeléshez kapcsolódó tényleges pénzkifizetés. Ilyen a bérek, anyagok, energia vagy bérleti díj kifizetése. A vállalat pénzforgalmában általában közvetlenül megjelenik.","id":113},{"t":"Implicit költség","kind":"definition","chapter":8,"definition":"A saját tulajdonú erőforrás felhasználása miatt feláldozott jövedelem vagy gazdasági érték.","explain":"Nem feltétlenül jár közvetlen pénzmozgással, mégis költség, mert az erőforrást másra is használhatnánk. A PDF példaként hozza a saját tőke kamatát, saját eszköz bérleti díját és a saját menedzseri munka bérét.","example":"Saját ingatlanban működő vállalkozás nem fizet bérleti díjat magának, de elveszíti az ingatlan kiadásának lehetőségét.","key":"Implicit = elmaradt legjobb alternatív hozam.","visual":null,"notes":"A saját tulajdonú erőforrás felhasználása miatt feláldozott jövedelem vagy gazdasági érték. Nem feltétlenül jár közvetlen pénzmozgással, mégis költség, mert az erőforrást másra is használhatnánk. A PDF példaként hozza a saját tőke kamatát, saját eszköz bérleti díját és a saját menedzseri munka bérét.","id":114},{"t":"Elsüllyedt költség","kind":"definition","chapter":8,"definition":"Olyan múltbeli ráfordítás, amely a jelenlegi döntéssel már nem nyerhető vissza.","explain":"A PDF a várható költséget állítja szembe a már megtörtént, elsüllyedt költséggel. A racionális jövőbeli döntést az befolyásolja, ami még megváltoztatható.","example":"Egy már kifizetett, vissza nem téríthető belépő árát nem tudod visszakapni, akár elmész az eseményre, akár nem.","key":"A jövőbeli többletköltség számít, nem a már visszahozhatatlan múlt.","visual":null,"notes":"Olyan múltbeli ráfordítás, amely a jelenlegi döntéssel már nem nyerhető vissza. A PDF a várható költséget állítja szembe a már megtörtént, elsüllyedt költséggel. A racionális jövőbeli döntést az befolyásolja, ami még megváltoztatható.","id":115},{"t":"Számviteli és gazdasági költség","kind":"blocks","chapter":8,"blocks":[["Számviteli költség","A PDF szerint explicit kifizetések + elszámolt amortizáció.","Könyvelési megközelítés."],["Gazdasági költség","Az összes releváns explicit és implicit költség.","Az alternatív lehetőségeket is számba veszi."],["Számviteli profit","Árbevétel − számviteli költség.","Könyvelt eredmény."],["Gazdasági profit","Árbevétel − teljes gazdasági költség.","Az alternatív hozam feletti eredmény."]],"lead":"","key":"A pozitív számviteli profit nem feltétlenül jelent pozitív gazdasági profitot.","notes":"A pozitív számviteli profit nem feltétlenül jelent pozitív gazdasági profitot.","id":116},{"t":"Számviteli kontra gazdasági profit","kind":"worked","chapter":8,"problem":"Egy vállalkozás bevétele 10 millió Ft, számviteli költsége 7 millió Ft. További 2 millió Ft feláldozott saját erőforrás-hozama van.","steps":["Számviteli profit = 10 − 7 = 3 millió Ft.","Gazdasági költség = 7 + 2 = 9 millió Ft.","Gazdasági profit = 10 − 9 = 1 millió Ft.","A 2 millió Ft implicit költség nem jelenik meg ugyanúgy a pénzkiadásban."],"conclusion":"Gazdaságilag a vállalkozás az alternatíváján felül 1 millió Ft-ot hoz.","visual":null,"notes":"Egy vállalkozás bevétele 10 millió Ft, számviteli költsége 7 millió Ft. További 2 millió Ft feláldozott saját erőforrás-hozama van.","id":117},{"t":"Gazdasági időtávok","kind":"blocks","chapter":8,"blocks":[["Pillanatnyi","Sem a termelt mennyiség, sem az inputok mennyisége nem változtatható.","A kínálat rögzített."],["Rövid táv","Legalább egy input változtatható, de van rögzített input.","Több műszak, több változó erőforrás."],["Hosszú táv","Valamennyi input mennyisége módosítható.","Üzemméretet is válthatunk."],["Nagyon hosszú táv","A technológia és akár a termék jellege is megváltozhat.","Innováció, új üzleti modell."]],"lead":"","key":"Az „időtáv” itt technológiai alkalmazkodási lehetőséget, nem fix naptári időt jelent.","notes":"Az „időtáv” itt technológiai alkalmazkodási lehetőséget, nem fix naptári időt jelent.","id":118},{"t":"Miért különbözik a rövid és hosszú táv?","kind":"concept","chapter":8,"lead":"A vállalat egyes erőforrásokat gyorsan, másokat csak lassan tud módosítani.","points":["Pillanatnyi időben még készletet sem feltétlenül lehet bővíteni.","Rövid távon módosulhat a munkaórák és anyagok mennyisége.","Hosszú távon üzemméret- és gépparkváltás is lehetséges."],"example":"Ha holnap duplázódik a rendelés, túlóra lehetséges, új csarnok építése nem.","key":"A költséggörbék időtávonként különböznek.","visual":null,"notes":"A vállalat egyes erőforrásokat gyorsan, másokat csak lassan tud módosítani. Ha holnap duplázódik a rendelés, túlóra lehetséges, új csarnok építése nem.","formula":"","id":119},{"t":"Teljes költség (TC)","kind":"definition","chapter":8,"definition":"A kibocsátás adott mennyiségéhez tartozó összes állandó és változó költség.","explain":"Rövid távon a teljes költség fix és változó részből áll. Nullás termelés mellett is maradhat fix költség.","example":"A cég havi 1 millió Ft bérleti díjat fizet, ezen felül termelésarányos anyagköltsége keletkezik.","key":"TC = FC + VC.","visual":null,"notes":"A kibocsátás adott mennyiségéhez tartozó összes állandó és változó költség. Rövid távon a teljes költség fix és változó részből áll. Nullás termelés mellett is maradhat fix költség.","id":120},{"t":"Fix, változó és kvázi fix költség","kind":"blocks","chapter":8,"blocks":[["Fix (FC)","Az adott rövid távon nem függ a kibocsátás mennyiségétől.","Bérleti díj, bizonyos állandó költségek."],["Változó (VC)","A kibocsátással együtt módosul.","Alapanyag, termelésarányos energia."],["Kvázi fix","Ha van termelés, adott összegben jelentkezik; nullás termelésnél elmaradhat.","A PDF külön kategóriaként említi."]],"lead":"","key":"A fix költség nem azt jelenti, hogy örökre változatlan.","notes":"A fix költség nem azt jelenti, hogy örökre változatlan.","id":121},{"t":"A teljes költség felbontása","kind":"formula","chapter":8,"formula":"TC(Q) = FC + VC(Q)","lead":"A teljes költség Q kibocsátásnál: a fix költség és a mennyiségtől függő változó költség összege.","points":["FC: rövid távon állandó.","VC(Q): mennyiségtől függ.","TC(Q): mindkettő összege."],"example":"FC=100 000 Ft, VC=3 000×Q Ft esetén Q=50-nél TC = 250 000 Ft.","key":"A zárójelben szereplő Q jelzi a mennyiségtől való függést.","visual":null,"notes":"A teljes költség Q kibocsátásnál: a fix költség és a mennyiségtől függő változó költség összege. FC=100 000 Ft, VC=3 000×Q Ft esetén Q=50-nél TC = 250 000 Ft.","id":122},{"t":"Határköltség (MC)","kind":"definition","chapter":8,"definition":"Az összköltség változása az előállított termékmennyiség egy egységgel történő növelésekor.","explain":"Azt mutatja, mennyibe kerül a következő termék. Rövid távon a fix költség nem változik a termelési volumen apró változásakor, ezért ΔTC = ΔVC.","example":"Ha 100 darab termék 120 000 Ft-ba, 101 darab 121 200 Ft-ba kerül, a 101. darab határköltsége 1200 Ft.","key":"MC = ΔTC/ΔQ = ΔVC/ΔQ.","visual":null,"notes":"Az összköltség változása az előállított termékmennyiség egy egységgel történő növelésekor. Azt mutatja, mennyibe kerül a következő termék. Rövid távon a fix költség nem változik a termelési volumen apró változásakor, ezért ΔTC = ΔVC.","id":123},{"t":"A határköltség képlete","kind":"formula","chapter":8,"formula":"MC = ΔTC / ΔQ = ΔVC / ΔQ","lead":"A kibocsátás pótlólagos egységére eső többletköltség.","points":["A rövid távú fix költség változatlan: ΔFC=0.","A MC sok szokásos modellben előbb csökken, később növekszik.","A MC vezeti a profitmaximalizáló mennyiség meghatározását."],"example":"Q: 50→60; TC: 150 000→180 000 Ft. MC az intervallumon átlagosan 30 000/10 = 3000 Ft/db.","key":"Ne keverd össze a MC-t a TC/Q átlagköltséggel.","visual":"costs","notes":"A kibocsátás pótlólagos egységére eső többletköltség. Q: 50→60; TC: 150 000→180 000 Ft. MC az intervallumon átlagosan 30 000/10 = 3000 Ft/db.","id":124},{"t":"A határköltség U alakú szakasza","kind":"visual","chapter":8,"visual":"costs","lead":"Sok rövid távú termelési modellben a MC kezdetben csökken, majd a kapacitás korláta miatt emelkedik.","points":["Csökkenő MC: javuló kihasználás, munkamegosztás.","Növekvő MC: egyre drágább újabb termékek.","A MC és az átlagköltségek metszéspontja fontos döntési jelzés."],"key":"A görbéket nem szabad önmagukban termelési szabálynak tekinteni; az árakat is figyelembe kell venni.","notes":"Sok rövid távú termelési modellben a MC kezdetben csökken, majd a kapacitás korláta miatt emelkedik. A görbéket nem szabad önmagukban termelési szabálynak tekinteni; az árakat is figyelembe kell venni.","example":"","id":125},{"t":"Átlagköltség (AC)","kind":"definition","chapter":8,"definition":"A teljes költség egy kibocsátott termékre jutó része.","explain":"A vállalat a teljes költséget szétosztja a legyártott mennyiségre. A fix költségek szétterülése gyakran csökkenti az átlagot, később a növekvő változó költség emelheti.","example":"TC=100 000 Ft, Q=50 db: AC=2000 Ft/db.","key":"AC=TC/Q.","visual":null,"notes":"A teljes költség egy kibocsátott termékre jutó része. A vállalat a teljes költséget szétosztja a legyártott mennyiségre. A fix költségek szétterülése gyakran csökkenti az átlagot, később a növekvő változó költség emelheti.","id":126},{"t":"Három átlagos költség","kind":"formula","chapter":8,"formula":"AC = TC/Q = AFC + AVC","lead":"A PDF a teljes-, változó- és állandó átlagköltséget együtt vizsgálja.","points":["AFC = FC/Q: átlagos fix költség.","AVC = VC/Q: átlagos változó költség.","AC = TC/Q: teljes átlagköltség."],"example":"FC=60 000 Ft, VC=90 000 Ft és Q=30: AFC=2000, AVC=3000, AC=5000 Ft/db.","key":"Az AC és AVC távolsága az AFC.","visual":"costs","notes":"A PDF a teljes-, változó- és állandó átlagköltséget együtt vizsgálja. FC=60 000 Ft, VC=90 000 Ft és Q=30: AFC=2000, AVC=3000, AC=5000 Ft/db.","id":127},{"t":"MC, AVC és AC egy közös ábrán","kind":"visual","chapter":8,"visual":"costs","lead":"Három görbe együtt: az egységnyi pótlólagos költség és a termékenként átlagolt költségek kapcsolata.","points":["Ha MC < AC, a következő egység csökkenti az AC-t.","Ha MC > AC, a következő egység növeli az AC-t.","MC az AC minimumában metszi az AC-t; az AVC minimumában az AVC-t."],"key":"Ez a viszony hasonló egy új jegy felvételéhez az átlagba: az átlag alatti új érték lehúzza az átlagot.","notes":"Három görbe együtt: az egységnyi pótlólagos költség és a termékenként átlagolt költségek kapcsolata. Ez a viszony hasonló egy új jegy felvételéhez az átlagba: az átlag alatti új érték lehúzza az átlagot.","example":"","id":128},{"t":"Miért metszi a MC az AC-t a minimumán?","kind":"worked","chapter":8,"problem":"Tegyük fel, hogy 100 termék átlagköltsége 1200 Ft, és még egy termék 800 Ft-ba kerül.","steps":["A 101. termék költsége az eddigi AC alatt van.","Ezért az új átlag kisebb lesz 1200 Ft-nál.","Ha a következő termék MC-je épp az AC-vel egyenlő, az átlag nem változik.","Ha a MC felülről váltja az AC-t, az átlag nőni kezd."],"conclusion":"Az AC minimumában: MC=AC a szokásos U alakú modellben.","visual":null,"notes":"Tegyük fel, hogy 100 termék átlagköltsége 1200 Ft, és még egy termék 800 Ft-ba kerül.","id":129},{"t":"Hosszú távú átlagköltség (LAC)","kind":"definition","chapter":8,"definition":"A különböző, hosszú távon választható üzemméretekhez tartozó legkisebb átlagköltségeket megmutató görbe.","explain":"Rövid távon az üzem adott. Hosszú távon a vállalat megválaszthatja, mekkora kapacitással érdemes működnie. A PDF a LAC-t a rövid távú átlagköltséggörbék burkológörbéjeként szemlélteti.","example":"Egy kis raktár olcsó kis forgalomhoz, nagyobb automatizált központ előnyös lehet nagy forgalomhoz.","key":"Optimális üzemméret = LAC-minimum.","visual":"longrun","notes":"A különböző, hosszú távon választható üzemméretekhez tartozó legkisebb átlagköltségeket megmutató görbe. Rövid távon az üzem adott. Hosszú távon a vállalat megválaszthatja, mekkora kapacitással érdemes működnie. A PDF a LAC-t a rövid távú átlagköltséggörbék burkológörbéjeként szemlélteti.","id":130},{"t":"Mérethatékonyság és irányítási költség","kind":"concept","chapter":8,"lead":"A tananyag szerint a LAC U alakja mögött a méretgazdaságosság és a túlzott méret hátrányai állnak.","points":["Csökkenő LAC: a kapacitásbővítés csökkentheti az egységköltséget.","Minimum: a modellben optimális üzemméret.","Növekvő LAC: emelkedő koordinációs és irányítási költségek."],"example":"Egy vállalat nem feltétlenül lesz gazdaságosabb korlátlanul nagyobb mérettől.","key":"Az optimális kapacitás az output függvényében értelmezendő.","visual":"longrun","notes":"az alapmodell szerint a LAC U alakja mögött a méretgazdaságosság és a túlzott méret hátrányai állnak. Egy vállalat nem feltétlenül lesz gazdaságosabb korlátlanul nagyobb mérettől.","formula":"","id":131},{"t":"Költségek: ellenőrzés","kind":
